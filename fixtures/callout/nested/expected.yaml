# Construct: callouts nested in callouts (spec §5.8, Q5). Each callout inside another is listed on its own, in
# document order, with `depth` = how many callouts enclose it, itself included. Recognized up to 32 deep,
# the reading view's limit; the 33rd level is a plain blockquote, so it is not listed (and `[!note] Nível 33`
# is just its text). A `[!secret]` inside a `[!note]` is listed like any other (the `callout/secret` fixture
# asserts what a reader is served). Cases, in order: two levels; three levels of different kinds with `+`/`-`;
# a secret in a note; nested and folded, both without a title; 33 levels of `note`.
callouts:
  - kind: note
    title: Duas camadas
    depth: 1
    pos: { line: 3, col: 1 }
  - kind: tip
    title: Dentro
    depth: 2
    pos: { line: 6, col: 3 }
  - kind: info
    title: Três camadas
    depth: 1
    pos: { line: 9, col: 1 }
  - kind: warning
    title: Meio
    fold: "+"
    depth: 2
    pos: { line: 10, col: 3 }
  - kind: danger
    title: Fundo
    fold: "-"
    depth: 3
    pos: { line: 11, col: 5 }
  - kind: note
    title: Com segredo
    depth: 1
    pos: { line: 14, col: 1 }
  - kind: secret
