# AI draft by Opus 5.5 on 2026-10-14 (ADR 0031), for the maintainer's approval (ADR 0087, spec Q9).
# Construct: the game master's secret, a callout of kind `secret` (spec
# §5.8, §6, Q9). In the file it is a callout like any other: `callouts`
# lists the secret ones with the rest, the kind as written. `reader` is
# the note as a UniVerso serves it to an account that may only read it
# (spec §4.1; ADR 0087 item 3): the lines of each secret callout removed,
# from its header to its last quoted line, at any depth — inside another
# callout (the `[!SECRET]-` one, the kind compared lower-cased) and inside
# a list item — with everything it holds; nothing else touched. A kind
# that is not `secret` (`[!secrets]`) stays.
callouts:
  - kind: secret
    title: Segredo do mestre
    pos: { line: 5, col: 1 }
  - kind: note
    title: Rumores
    pos: { line: 10, col: 1 }
  - kind: SECRET
    fold: "-"
    pos: { line: 13, col: 3 }
  - kind: secret
    pos: { line: 19, col: 3 }
  - kind: secrets
    title: Não é um segredo
    pos: { line: 22, col: 1 }
reader: |
  # Taverna do Porto

  O barão governa o distrito norte. Ver [[Barão Vermelho]].


  > [!note] Rumores
  > Dizem que o barão não come.
  >
  >
  > Os guardas evitam a mansão.

  - A mansão

  > [!secrets] Não é um segredo
  > Um callout de outro tipo fica.

  Fim da página.
source: ADR 0087 (spec §6, Q9)
