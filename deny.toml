# cargo-deny configuration (ADR 0029, workspace guardrail).
#
# License allowlist follows the license decision (ADR 0005, MPL-2.0 for the
# core and app): permissive licenses and MPL-2.0 itself. GPL, LGPL and AGPL
# stay out. Any other license enters only with a justification in the PR
# that adds the dependency (ADR 0033).
#
# Advisories: a new advisory makes CI red with no PR to blame. Policy
# (ADR 0029): an exception in [advisories].ignore needs the advisory id,
# a reason, a link and an expiry date in the reason text; an expired
# exception is removed, and CI is red again.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "why; link; expires 2026-12-31" },
  # Seven "unmaintained" notices (not vulnerabilities) in the Tauri v2 tree
  # (Phase 2 shell, app/src-tauri, 2026-09-22). None has a safe upgrade:
  # they enter through tauri-utils/urlpattern (unic-*), tauri-macros
  # (proc-macro-error) and tauri-plugin-dialog (paste). Revisit when Tauri
  # moves off them. Ratified by the maintainer on 2026-09-23
  # (docs/review/phase-2.md §6, item 7).
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, pulled by Tauri plugins; https://rustsec.org/advisories/RUSTSEC-2024-0436; expires 2026-12-31" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, pulled by Tauri macros; https://rustsec.org/advisories/RUSTSEC-2024-0370; expires 2026-12-31" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: unmaintained, via tauri-utils/urlpattern; https://rustsec.org/advisories/RUSTSEC-2025-0081; expires 2026-12-31" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: unmaintained, via tauri-utils/urlpattern; https://rustsec.org/advisories/RUSTSEC-2025-0075; expires 2026-12-31" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: unmaintained, via tauri-utils/urlpattern; https://rustsec.org/advisories/RUSTSEC-2025-0080; expires 2026-12-31" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: unmaintained, via tauri-utils/urlpattern; https://rustsec.org/advisories/RUSTSEC-2025-0100; expires 2026-12-31" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: unmaintained, via tauri-utils/urlpattern; https://rustsec.org/advisories/RUSTSEC-2025-0098; expires 2026-12-31" },
  # An "unmaintained" notice (not a vulnerability) through yrs, the Yjs CRDT
  # of simultaneous editing (ADR 0073 item 7, crates/verso-server,
  # 2026-10-09): yrs 0.28, the latest, still uses smallstr. Revisit when yrs
  # drops it. Ratified by the maintainer on 2026-10-10.
  { id = "RUSTSEC-2026-0215", reason = "smallstr: unmaintained, via yrs; https://rustsec.org/advisories/RUSTSEC-2026-0215; expires 2026-12-31" },
  # zip advisories for ZipArchive::extract and ZipStreamReader::extract:
  # app/src-tauri does manual extraction with enclosed_name() and does not use extract().
  { id = "RUSTSEC-2026-0367", reason = "zip: SUID/SGID preservation during extract(); app does not use extract(); https://rustsec.org/advisories/RUSTSEC-2026-0367; expires 2026-12-31" },
  { id = "RUSTSEC-2026-0368", reason = "zip: ZipArchive::extract symlink traversal; app does not use extract(); https://rustsec.org/advisories/RUSTSEC-2026-0368; expires 2026-12-31" },
  { id = "RUSTSEC-2026-0369", reason = "zip: ZipStreamReader::extract unconfined symlinks; app does not use extract(); https://rustsec.org/advisories/RUSTSEC-2026-0369; expires 2026-12-31" },
  # Three "unmaintained" notices (not vulnerabilities) published 2026-10 for
  # the zbus D-Bus family, pulled on Linux by tauri-plugin-notification
  # (notify-rust, ADR 0084) and tauri-plugin-single-instance. No safe upgrade
  # exists. Revisit when the plugins move. Added 2026-10-21. Ratified by the
  # maintainer on 2026-10-21 (decisions list, item X.1, option A), until
  # 2026-12-31; revisit when the Tauri plugins change library.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, via zbus (Tauri notification and single-instance plugins, Linux); https://rustsec.org/advisories/RUSTSEC-2026-0370; expires 2026-12-31" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, via zbus (Tauri notification and single-instance plugins, Linux); https://rustsec.org/advisories/RUSTSEC-2026-0371; expires 2026-12-31" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, via zbus (Tauri notification and single-instance plugins, Linux); https://rustsec.org/advisories/RUSTSEC-2026-0372; expires 2026-12-31" },

]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  # Zero-clause BSD: permission to use for any purpose, no notice required —
  # more permissive than MIT. quoted_printable, through lettre, the e-mail
  # of the server (ADR 0074 item 2, 2026-10-09). Ratified by the
  # maintainer on 2026-10-10.
  "0BSD",
  # Apache-2.0 whose only addition removes a GPL-style linking concern;
  # target-lexicon, in the Tauri v2 tree (2026-09-22). Ratified by the
  # maintainer on 2026-09-23 (docs/review/phase-2.md §6, item 7).
  "Apache-2.0 WITH LLVM-exception",
  # CDLA-Permissive-2.0 (Community Data License Agreement — Permissive 2.0):
  # permissive license used for data/certificate bundles, no copyleft, no
  # linking restrictions. Pulled by webpki-root-certs v1.x (root CA
  # certificates) via reqwest v0.13 → rustls-platform-verifier → verso-app.
  # Added when upgrading reqwest to v0.13 for the in-app update system
  # (2026-09-27). Ratified by the maintainer in the 0.3.0-beta.1 PR.
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0: permissive, OSI and FSF approved, no notice
  # required in a binary — as permissive as MIT. First pulled by xxhash-rust
  # (its xxh3), a required dependency of notify 9 (the poll watcher's
  # hashes), taken for the Windows watcher fix (C5, 2026-11-03). Ratified
  # by the maintainer on 2026-11-04 as an accepted licence.
  "BSL-1.0",
]
confidence-threshold = 0.9
# The allowlist is written before the dependencies exist; an unused entry is
# not a problem.
unused-allowed-license = "allow"
exceptions = [
  # { allow = ["..."], crate = "..." }  # only with a justification in the PR
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Tripwire for the day the [patch.crates-io] block in the workspace
  # Cargo.toml is removed: any pulldown-cmark release from 0.13.5 on turns
  # CI red here so that the action is not forgotten. Action: run
  # `cargo test -p verso-dialect --test regressions` on the release (the
  # panic and the exponential-time inputs must pass) and check that the
  # release has the `std` feature, then delete this entry, the allow-git
  # entry below and the patch, in one PR. Maintainer's decision of
  # 2026-09-21; expires 2026-12-31 with the patch.
  #
  # `name` + `version` on purpose: `version` is a real semver requirement.
  # The newer `crate = "name@..."` form is a package-id spec that drops the
  # comparison operator and matches one exact version (cargo-deny 0.20.2).
  { name = "pulldown-cmark", version = ">=0.13.5", reason = "release 0.13.5 or later: confirm the two regression tests pass and the std feature exists, then drop the patch, the allow-git entry and this ban (ADR 0037)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# pulldown-cmark is built from an upstream revision until the release after
# 0.13.4 (workspace Cargo.toml, [patch.crates-io]; ADR 0037, Consequences).
# Maintainer's decision of 2026-09-21; expires 2026-12-31. Remove together
# with the patch and the ban above.
allow-git = ["https://github.com/pulldown-cmark/pulldown-cmark"]
