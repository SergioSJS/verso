<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de visita</title>
<style>
  body { font-family: Georgia, serif; background: #f7f1e8; color: #2b2b2b; display: grid; place-items: center; min-height: 90vh; margin: 0; }
  .cartao { background: #fffdf8; border: 1px solid #d9cbb5; border-radius: 14px; padding: 32px 40px; max-width: 420px; box-shadow: 0 6px 24px rgba(80, 60, 30, .12); }
  h1 { margin: 0 0 4px; font-size: 28px; color: #8a5a1c; }
  p { line-height: 1.5; }
  .dica { font-size: 14px; color: #6b6b6b; border-top: 1px dashed #d9cbb5; padding-top: 12px; }
</style>
</head>
<body>
  <div class="cartao">
    <h1>Um arquivo HTML</h1>
    <p>O Verso abre arquivos <code>.html</code> da pasta como uma página — sem rodar scripts.</p>
    <p class="dica">No canto da aba, <strong>Página</strong> e <strong>Fonte</strong> alternam entre a página e o código dela.</p>
  </div>
</body>
</html>
