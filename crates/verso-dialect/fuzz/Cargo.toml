# Fuzz harness for verso-dialect (ADR 0029, feature guardrail of Phase 1,
# feature 1). Its own package, excluded from the workspace: it is a dev
# tool that never ships, and `libfuzzer-sys` needs the nightly toolchain.
#
#   cd crates/verso-dialect && cargo +nightly fuzz run parse
#
# libfuzzer-sys is MIT OR Apache-2.0, with LLVM's libFuzzer (NCSA) bundled;
# it is linked into this harness only, never into a product crate, which is
# why it is outside the cargo-deny graph of the workspace.

[package]
name = "verso-dialect-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A workspace of its own, so that cargo never looks above this manifest for
# one: a checkout nested inside another (a git worktree under the
# repository's directory) would otherwise be claimed by the outer workspace,
# whose `exclude` does not name this path, and the harness would not build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.verso-dialect]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# The canvas reader of verso-core, compiled from its own source file
# (fuzz_targets/canvas.rs): decided on 2026-10-01, review `board.md` §6
# item 9.
[[bin]]
name = "canvas"
path = "fuzz_targets/canvas.rs"
test = false
doc = false
bench = false

# Same patch as the workspace Cargo.toml: this harness is its own package,
# so the patch has to be repeated here. Remove together (ADR 0037).
[patch.crates-io]
pulldown-cmark = { git = "https://github.com/pulldown-cmark/pulldown-cmark", rev = "c51a2a4cd8ed07a4b1467cc546edcc51eff40703" }
