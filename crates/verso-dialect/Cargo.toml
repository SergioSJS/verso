[package]
name = "verso-dialect"
description = "Pure parser of the Verso dialect: no IO, no async"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No IO and no async dependencies, ever (ADR 0028). A new dependency needs a
# justification in the PR (ADR 0033).
[dependencies]
# Base parser (ADR 0037): CommonMark events with byte ranges. `std` only;
# the `html` and `getopts` defaults are a renderer and a CLI we do not use.
# The requirement is "0.13" and not "0.13.4" because the workspace patches
# the crate to an upstream revision whose manifest still says 0.13.1 (see
# [patch.crates-io] in the workspace Cargo.toml); `std` is a feature there
# and on no published 0.13.x, so a build without the patch fails to
# resolve instead of falling back to the buggy 0.13.4. When the patch goes,
# the release must have the `std` feature or this line changes with it.
pulldown-cmark = { version = "0.13", default-features = false, features = ["std", "html"] }
# YAML 1.2 for the frontmatter block the base hands over opaque (ADR 0037,
# consequences; spec Q24 stays open). `encoding` off: the input is already
# a `&str`; decoding is not this crate's job (spec Q25).
saphyr = { version = "0.1.0", default-features = false }
# The event stream under `saphyr` (already in the tree), used to bound the
# nesting depth of the frontmatter before a tree is built: `saphyr`'s loader
# recurses per level and overflows the stack at a few thousand levels.
saphyr-parser = "0.1.0"

[dev-dependencies]
# Round-trip property test of ADR 0029, under the four properties of Q18.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
