# verso-server keeps files of its own in VERSO_DATA_DIR (ADR 0075 item 3),
# never a file of a folder of notes (ADR 0026 rule 5): the database is
# opened by rusqlite, and two std::fs calls are its own, both in
# src/data.rs only (scripts/check.sh): `create_dir_all`, the data
# directory made at the first start, and `read_to_string`, a secret given
# as a file (`VERSO_ADMIN_PASSWORD_FILE`, ADR 0074 item 1; ADR 0075 item
# 6). Clippy does not merge this file with the workspace one, so the test
# allowances are repeated and the list is the workspace's minus those two.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
  { path = "std::fs::read", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::write", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::rename", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::read_dir", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::set_permissions", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::OpenOptions::open", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::copy", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::remove_file", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::remove_dir", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::remove_dir_all", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::create_dir", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::hard_link", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::soft_link", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::read_link", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::metadata", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::symlink_metadata", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::canonicalize", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::exists", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::File::open", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::File::create", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::File::create_new", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::fs::File::options", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  # Each OS has its own symlink calls; the entries of the other OS do not
  # resolve there, and allow-invalid keeps clippy quiet about that while
  # the entry still binds where it resolves (ADR 0069: the Windows build).
  { path = "std::os::unix::fs::symlink", reason = "disk access only in verso-fs (ADR 0026 rule 5)", allow-invalid = true },
  { path = "std::os::unix::fs::chown", reason = "disk access only in verso-fs (ADR 0026 rule 5)", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "disk access only in verso-fs (ADR 0026 rule 5)", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "disk access only in verso-fs (ADR 0026 rule 5)", allow-invalid = true },
  { path = "std::fs::DirBuilder::create", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  # Path methods inspect or traverse the filesystem too.
  { path = "std::path::Path::exists", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::try_exists", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::is_file", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::is_dir", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::is_symlink", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::metadata", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::symlink_metadata", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::read_dir", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::read_link", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
  { path = "std::path::Path::canonicalize", reason = "disk access only in verso-fs (ADR 0026 rule 5)" },
]
