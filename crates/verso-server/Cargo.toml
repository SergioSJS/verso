[package]
name = "verso-server"
description = "`verso serve`: the contract over HTTP and WebSocket, the window served to a browser, accounts and access (ADR 0073, 0074, 0075)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The server (ADR 0073 item 2; the maintainer's answer B of 2026-10-09).
# It reaches the folders only through verso-service and verso-core, and so
# verso-fs (ADR 0026 rule 5). Files of its own: the database in
# VERSO_DATA_DIR (opened by rusqlite, as verso-index opens the index), the
# data directory made at start, and a secret read from a file
# (`NAME_FILE`, ADR 0075 item 6) — the exceptions its clippy.toml declares.
[dependencies]
verso-service = { path = "../verso-service" }
verso-core = { path = "../verso-core" }
verso-contract = { path = "../verso-contract" }
verso-fs = { path = "../verso-fs" }
# A UniVerso's own Cloudflare link (ADR 0117 D4 item 2, R5): the tunnel
# module the desktop app runs, moved into a crate both hosts use. It adds
# no crate to the tree (its dependencies were the app's already).
verso-tunnel = { path = "../verso-tunnel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The async runtime under the HTTP server; already in the tree through
# Tauri, rmcp and reqwest (MIT).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time", "io-util"] }
# HTTP and WebSocket routing (MIT), over hyper and tower, both already in
# the tree through reqwest. Nothing of ours did this; std has no HTTP.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
# Each connection served by hyper's own HTTP/1 builder, with a timer, so
# that a request's headers have a deadline and a connection is counted
# before it is read (threat-model.md, gap 8): axum::serve gives neither.
# Both already in the tree under axum (MIT); nothing of ours did this.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "service"] }
# The window's files served from VERSO_UI_DIR, with ranges and validators
# (MIT); already in the tree through reqwest.
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
# TLS served by the server itself, from the host's certificate and key
# files (VERSO_TLS_CERT_FILE, VERSO_TLS_KEY_FILE; the maintainer's answer F
# of 2026-10-09). rustls on ring (Apache-2.0 AND ISC), both already in the
# tree through reqwest; no OpenSSL to cross-compile for ARM.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# The update check (the maintainer's answer E of 2026-10-09): one HTTPS
# request a day to the project's release feed, the only place the server
# reaches (ADR 0050 as revised that day). Already in the tree through the
# desktop app; without its own crypto provider, so ring (above) serves it
# and the static build carries no aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# The accounts, sessions, invitations, tokens, grants and the audit log
# (ADR 0074 item 10): SQLite, as the index (MIT, public domain).
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
# Passwords hashed with Argon2id (ADR 0074 item 3; MIT OR Apache-2.0).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
# Simultaneous editing of notes (ADR 0073 item 7; the maintainer's answer
# L of 2026-10-09): the Rust implementation of the Yjs CRDT the window's
# y-codemirror.next speaks (MIT); and a three-way merge of lines for a
# write that reaches a shared note from elsewhere — the properties panel,
# a quote from a PDF — over the edits still unsaved (MIT OR Apache-2.0).
yrs = "0.28"
diffy = "0.5"
# Passkeys (WebAuthn; ADR 0074 item 3, MPL-2.0), the implementation the ADR
# names. It verifies through OpenSSL: on the static musl builds of the
# release, OpenSSL is compiled from its sources (vendored, Apache-2.0) so
# the binary still needs no library of the system.
webauthn-rs = "0.5"
# E-mail through the host's mail server when VERSO_SMTP_URL is set
# (ADR 0074 items 2 to 5): sign-in links, password resets and invitations
# sent by mail (MIT OR Apache-2.0); rustls on ring, as the server's TLS.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }
# Random tokens and their SHA-256 at rest (ADR 0074 items 7 and 8);
# both already in the tree (MIT OR Apache-2.0).
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
# An account's e-mail compared in NFC (ADR 0074 item 2); already used by
# verso-index (MIT OR Apache-2.0).
unicode-normalization = "0.1"

# webauthn-rs speaks OpenSSL: built into the binary on every system, so the
# `verso` a package or the app carries never looks for a system or
# Homebrew libssl that a user's machine may not have (the release
# rehearsal of 2026-10-10 found the macOS one linked to
# /opt/homebrew/opt/openssl@3). On Windows too (ADR 0075 item 2, revised
# 2026-10-15): the build needs Perl, which `openssl-src` runs to configure
# OpenSSL (NASM is not needed: assembly is off when it is missing).
# "This app is a server" (ADR 0096; the local mode of the desktop app, crates
# verso-server/src/local). Each is justified where it is used:
# - rcgen (MIT OR Apache-2.0): the app's own self-signed certificate (item 5
#   (a)); already in the tree as this crate's test dependency (ring, pem), now
#   also shipped. It replaces nothing of ours: nothing made certificates.
# - qrcode (MIT OR Apache-2.0): the pairing QR (item 6), the matrix only
#   (no image encoder; the SVG is drawn here). Nothing of ours encoded QR.
# - mdns-sd (MIT OR Apache-2.0): the `_verso-local._tcp` announcement while
#   the pairing dialog is open (item 8), a pure-Rust responder with no async
#   runtime of its own (default features off). Nothing of ours spoke mDNS.
# - if-addrs (MIT OR BSD-3-Clause): the machine's interface addresses and
#   netmasks (items 3, 10), which std cannot list; it is already mdns-sd's own
#   dependency, so it adds no crate to the tree.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
qrcode = { version = "0.14", default-features = false }
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"

openssl = { version = "0.10", features = ["vendored"] }

# The internet link's listener told the queue it asks for on Windows too
# (`local/link.rs`, `LISTEN_BACKLOG`): tokio's `TcpSocket::listen` cannot
# pass Windows' `SOMAXCONN_HINT`, and `unsafe` is forbidden, so no direct
# call to `listen`. socket2 (MIT OR Apache-2.0) is already in the tree, the
# same version, under tokio, hyper-util, lettre and mdns-sd; it adds no
# crate.
socket2 = "0.6"

[dev-dependencies]
tempfile = "3.27"
# A directory made unwritable for the tests of storage.rs and tests_http.rs.
verso-fs = { path = "../verso-fs", features = ["test-util"] }
# The server driven as a window drives it: HTTP and the contract's
# WebSocket, in tests only; both already in the tree.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# fail2ban's filter of packaging/server/fail2ban/ run over the server's own
# log lines, as fail2ban runs it (ADR 0083 item 1): a regular expression
# engine, in tests only. Already in the tree (MIT OR Apache-2.0); nothing
# of ours matched regular expressions.
regex = "1"

# The server's inputs opened to its fuzz harness (`fuzz/`, ADR 0083 item
# 14): the `fuzz_api` module, compiled with this feature only. Nothing
# that ships turns it on.
[features]
fuzzing = []
# A player made at the computer, for the tests of this crate and of the
# app's host (`LocalServer::invite_for_tests`): the app invites at the
# folder's page and ships without it. The app turns it on in its
# dev-dependencies only.
test-support = []

[lints]
workspace = true
