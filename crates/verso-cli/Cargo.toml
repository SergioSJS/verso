[package]
name = "verso-cli"
description = "The verso command: index, search, backlinks (Phase 1); mcp (feature 6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "verso"
path = "src/main.rs"

# Reads arguments and prints; never touches the open folder directly
# (ADR 0026, rule 5, delimited scope). Messages in pt-BR and EN from the
# first feature (ADR 0035): every user-facing string goes through
# `messages::text`. Arguments are parsed by hand — three subcommands, two
# options — and the help text is in both languages, which no parser crate
# gives for free (`docs/reference/cli-decision.md`, provisional).
[dependencies]
verso-core = { path = "../verso-core" }
# `verso <folder>` asks whether its first argument names an existing
# directory — of verso-fs, the one crate that touches the disk (ADR 0026
# rule 5): `Root::open` is the entry edge where a path string is accepted,
# and it reads nothing. The MCP test also edits a note through it while
# the server runs, as the std::fs guardrail asks of tests too.
verso-fs = { path = "../verso-fs" }
# `verso mcp` (feature 6): the official Rust SDK for the Model Context
# Protocol, server side over stdio only (docs/reference/mcp-decision.md,
# provisional). `default-features = false`: no HTTP, no auth, no client.
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true

# `verso serve` (ADR 0073 item 2; the maintainer's answer C of 2026-10-09:
# a subcommand of this binary, not a binary of its own), on Linux and macOS. Windows is no server platform
# (ADR 0075 item 2: Docker, CasaOS, .deb/.rpm), and webauthn-rs's OpenSSL
# would need a build of its own there: `verso serve` says so instead.
[target.'cfg(not(windows))'.dependencies]
verso-server = { path = "../verso-server" }
