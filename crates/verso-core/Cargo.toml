[package]
name = "verso-core"
description = "Orchestrates the folder, the parser and the index; exposes the contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Reads and writes the configuration directory only; never the open folder
# (ADR 0026, rule 5, delimited scope; ADR 0011). Today it needs no std::fs
# call of its own: the index creates its directory, and the folder is
# verso-fs's.
[dependencies]
verso-dialect = { path = "../verso-dialect" }
verso-fs = { path = "../verso-fs" }
verso-index = { path = "../verso-index" }
# The index's sidecar (src/sidecar.rs). Both already in the lockfile through
# verso-cli: no new crate, no new licence.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sync compares names as macOS and Windows do, ignoring case and Unicode
# normalization (ADR 0079): already in the tree through verso-index, same
# licence (MIT OR Apache-2.0).
unicode-normalization = "0.1"
# Sync joins two appends to a note (ADR 0079 item 8): the base is known by
# its SHA-256 alone, so the prefix that is the base is found by hashing.
# Already in the tree through verso-app and verso-server, same licence
# (MIT OR Apache-2.0).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27"
# The canvas round-trip property test (ADR 0057, Consequences), as
# verso-dialect's (ADR 0029); already in the tree.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
