[package]
name = "verso-fs"
description = "Opaque handles, watcher, atomic write and path confinement for the open folder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The only crate that touches the files of the open folder (ADR 0026, rule 5;
# ADR 0028). File IO dependencies (walkdir, notify, tempfile and the like)
# belong here and nowhere else.
# `test-util`: helpers for the tests of other crates (a directory made
# unwritable), enabled only from their dev-dependencies; nothing ships it.
[features]
test-util = []

[dependencies]
# Change events for the open folder, so that what another app writes shows
# up without reopening it: FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows, one API over the three. std has no file
# watching; the alternative, walking the folder on a timer, costs a walk per
# tick whether anything changed or not (docs/reference/watcher-decision.md).
notify = "8.2"
# The `.gitignore` semantics the walk honors (ADR 0044, revised
# 2026-09-29): negation, `**`, anchoring, dir-only patterns — ripgrep's
# own engine, instead of a partial matcher of ours that got `!` wrong.
# Only the `gitignore` module is used; the crate's own walker is not.
ignore = "0.4"
# A new name is compared with its siblings as every device compares names:
# case aside and its accents in one Unicode form (spec Q7, decided
# 2026-10-10; Q8's creation side, 2026-10-12), so `Café.md` composed is
# refused beside `CAFÉ.md` decomposed. std has no Unicode normalization;
# already in the lockfile through verso-index, verso-core and verso-server,
# same version and licence (MIT OR Apache-2.0).
unicode-normalization = "0.1"
# The disk's free space for a download from the cloud (ADR 0043, decided
# 2026-10-27): `statvfs` and `GetDiskFreeSpaceExW` have no std counterpart
# and calling them needs `unsafe`, which the workspace forbids; fs4's
# `available_space` wraps both (on Unix through `rustix`, already in the
# tree). Replaces nothing of ours. MIT OR Apache-2.0.
fs4 = "1"

[target.'cfg(windows)'.dependencies]
# A file's identity (volume serial number and file index) and its hard link
# count: std keeps them unstable on Windows (`windows_by_handle`), and the
# call behind them, `GetFileInformationByHandle`, needs `unsafe`, which the
# workspace forbids. BurntSushi's crate wraps it in a safe function; it is
# already in the lockfile, through `ignore` and `walkdir` (ADR 0069, item 9).
winapi-util = "0.1"

[target.'cfg(unix)'.dependencies]
# Extended attributes are not in std; the atomic write has to carry them
# over (Finder tags, quarantine) or say it could not (ADR 0029). Unix only:
# the crate does not build on Windows, whose counterpart, alternate data
# streams, is an item of the Windows port (ADR 0069, item 9).
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
# `statfs` is not in std; the atomic write has to know when the folder is on
# a network file system, where rename is not atomic (ADR 0029). macOS only
# for now: the initial platform (ADR 0022); elsewhere the report says
# nothing (`None`: not detected).
nix = { version = "0.31", default-features = false, features = ["fs", "mount"] }
# `renamex_np` with `RENAME_EXCL`: a rename that fails instead of replacing
# the destination, so a new or moved file takes its name in one step and
# not by `link` and `unlink` — FSEvents never reports the removal of a file
# named by `link` (ADR 0069, revised 2026-10-11). std has no such rename;
# `nix` offers it only on Linux (`renameat2`); calling it ourselves needs
# `unsafe`, which the workspace forbids. Already in the lockfile, at this
# version, through `xattr` and `tempfile`. `fs` is the call; `std` lets it
# take a `Path` and turns its error into `std::io::Error`.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The same `statfs`, for the server's folders on Linux: a root on NFS or SMB
# is scanned, since the watcher hears nothing there (ADR 0075 item 3).
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
# Every test builds a throwaway folder and walks or writes into it.
tempfile = "3.27"

[lints]
workspace = true
