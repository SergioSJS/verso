[package]
name = "verso-contract"
description = "The core↔UI contract: the types that cross, from which the TypeScript side is generated (ADR 0026, ADR 0038)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Types only: no IO, no async, no Tauri. specta is the generator decided on
# 2026-09-22 (ADR 0038); the command bindings are generated by tauri-specta
# in app/src-tauri from these types.
[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[lints]
workspace = true

# The serialised words of the capabilities, checked in the crate's tests
# (already in the tree through every other crate; tests only).
[dev-dependencies]
serde_json = "1"
