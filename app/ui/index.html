<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="side">
    <header class="side-head">
      <button id="open" type="button" class="folder-button" title="⌘O">
        <span class="ic" data-icon="folder"></span>
        <span id="folder" class="folder-name"></span>
      </button>
      <button id="reindex" type="button" class="ghost iconic" disabled></button>
    </header>
    <label class="search">
      <span class="ic" data-icon="search"></span>
      <span id="search-label" class="sr-only"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" disabled>
      <kbd>⌘K</kbd>
    </label>
    <nav class="side-body" aria-labelledby="notes-heading">
      <h2 id="notes-heading" class="side-title"></h2>
      <ul id="notes" class="tree"></ul>
    </nav>
    <section class="side-outline" aria-labelledby="outline-heading" hidden>
      <h2 id="outline-heading" class="side-title"></h2>
      <ul id="outline" class="outline"></ul>
    </section>
  </aside>

  <main class="page">
    <div id="panes" class="panes"></div>
    <footer class="status-bar">
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <span class="status-keys"><kbd>⌘E</kbd> <span id="keys-edit"></span> · <kbd>⌘\</kbd> <span id="keys-split"></span> · <kbd>⌘W</kbd> <span id="keys-close"></span></span>
    </footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
