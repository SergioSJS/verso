<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <button id="open" type="button" class="primary"></button>
    <span id="folder" class="folder" aria-live="polite"></span>
    <button id="reindex" type="button" disabled></button>
    <label class="search">
      <span id="search-label" class="sr-only"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" disabled>
    </label>
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </header>
  <main class="panes">
    <nav class="side" aria-labelledby="notes-heading">
      <h2 id="notes-heading" class="side-title"></h2>
      <ul id="notes" class="list"></ul>
    </nav>
    <section class="note" aria-labelledby="note-title">
      <nav id="crumbs" class="crumbs" aria-label="breadcrumb"></nav>
      <div class="note-head">
        <h2 id="note-title" class="note-title"></h2>
        <span id="dirty" class="dirty" hidden>●</span>
        <button id="save" type="button" class="small primary" hidden></button>
        <div id="modes" class="modes" role="group" hidden>
          <button id="mode-preview" type="button" class="small" aria-pressed="true"></button>
          <button id="mode-live" type="button" class="small" aria-pressed="false"></button>
          <button id="mode-source" type="button" class="small" aria-pressed="false"></button>
        </div>
      </div>
      <p id="note-flags" class="flags"></p>
      <dl id="props" class="props" hidden></dl>
      <div id="conflict" class="conflict" hidden>
        <p id="conflict-text"></p>
        <pre id="conflict-diff" class="diff"></pre>
        <div class="conflict-actions">
          <button id="conflict-reload" type="button" class="small"></button>
          <button id="conflict-overwrite" type="button" class="small"></button>
        </div>
      </div>
      <article id="preview" class="preview"></article>
      <div id="editor" class="editor" hidden></div>
      <h3 id="backlinks-heading" class="section-title"></h3>
      <ul id="backlinks" class="list"></ul>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
