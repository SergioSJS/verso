<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="side">
    <header class="side-head">
      <button id="open" type="button" class="folder-button" title="⌘O">
        <span class="ic" data-icon="folder"></span>
        <span id="folder" class="folder-name"></span>
      </button>
      <button id="new" type="button" class="ghost iconic" disabled></button>
      <button id="collapse" type="button" class="ghost iconic" disabled></button>
      <button id="reindex" type="button" class="ghost iconic" disabled></button>
    </header>
    <label class="search">
      <span class="ic" data-icon="search"></span>
      <span id="search-label" class="sr-only"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" disabled>
      <kbd>⌘K</kbd>
    </label>
    <nav id="tree-root" class="side-body" aria-labelledby="notes-heading">
      <h2 id="notes-heading" class="side-title"></h2>
      <ul id="notes" class="tree"></ul>
    </nav>
  </aside>

  <div id="side-divider" class="side-divider" role="separator" aria-orientation="vertical"></div>
  <main class="page">
    <div id="spaces" class="spaces" role="tablist"></div>
    <div id="panes" class="panes"></div>
    <footer class="status-bar">
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <span class="status-keys"><kbd>⌘N</kbd> <span id="keys-new"></span> · <kbd>⌘E</kbd> <span id="keys-edit"></span> · <kbd>⌘\</kbd> <span id="keys-split"></span> · <kbd>⌘T</kbd> <span id="keys-space"></span></span>
    </footer>
  </main>
  <div id="right-divider" class="side-divider right" role="separator" aria-orientation="vertical"></div>
  <aside id="right" class="right">
    <div id="right-tabs" class="right-tabs" role="tablist"></div>
    <div id="right-body" class="right-body"></div>
  </aside>
  <script type="module" src="main.js"></script>
</body>
</html>
