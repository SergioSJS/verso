<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verso</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="pdf_viewer.css">
  <link rel="stylesheet" href="katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-right">
  <div id="top-progress" class="top-progress" hidden><div id="top-progress-fill" class="top-progress-fill"></div></div>
  <nav id="ribbon" class="ribbon"></nav>
  <aside class="side">
    <header class="side-head">
      <button id="open" type="button" class="folder-button" title="⌘O" aria-busy="true">
        <span class="ic" data-icon="folder"></span>
        <span id="folder" class="folder-name"></span>
      </button>
      <button id="collapse" type="button" class="ghost iconic" disabled></button>
    </header>
    <label class="search">
      <span class="ic" data-icon="search"></span>
      <span id="search-label" class="sr-only"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" disabled>
      <button id="search-clear" type="button" class="ghost iconic search-clear"><span class="ic" data-icon="close"></span></button>
      <kbd>⌘K</kbd>
    </label>
    <nav id="tree-root" class="side-body" aria-labelledby="notes-heading">
      <h2 id="notes-heading" class="side-title"></h2>
      <ul id="notes" class="tree" role="tree" aria-multiselectable="true"></ul>
    </nav>
  </aside>

  <div id="side-divider" class="side-divider" role="separator" aria-orientation="vertical"></div>
  <main class="work">
    <div id="spaces" class="spaces"></div>
    <div id="panes" class="panes"></div>
    <footer class="status-bar">
      <button id="toggle-side" type="button" class="ghost iconic bar-toggle"></button>
      <span id="status" class="status"></span>
      <div id="index-progress" class="index-progress" hidden>
        <div class="index-progress-track">
          <div id="index-progress-bar" class="index-progress-bar"></div>
        </div>
        <span id="index-progress-label" class="index-progress-label"></span>
      </div>
      <span id="words" class="status-words"></span>
      <span class="status-keys"><button type="button" data-cmd="new"><kbd>⌘N</kbd> <span id="keys-new"></span></button><button type="button" data-cmd="split"><kbd>⌘\</kbd> <span id="keys-split"></span></button><button type="button" data-cmd="space"><kbd>⌘T</kbd> <span id="keys-space"></span></button><button type="button" data-cmd="palette" id="keys-commands" class="status-icon"></button></span>
      <button id="report-bug" type="button" class="ghost iconic bar-toggle"></button>
      <button id="toggle-right" type="button" class="ghost iconic bar-toggle"></button>
    </footer>
  </main>
  <div id="right-divider" class="side-divider right" role="separator" aria-orientation="vertical"></div>
  <aside id="right" class="right">
    <div class="right-close"><span id="right-title"></span><button id="right-close" type="button" class="ghost iconic"></button></div>
    <div id="right-tabs" class="right-tabs" role="tablist"></div>
    <div id="right-body" class="right-body"></div>
  </aside>
  <script type="module" src="main.js"></script>
</body>
</html>
