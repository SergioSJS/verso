[package]
name = "verso-app"
description = "The desktop shell: a Tauri v2 window over verso-core through the contract (Phase 2, walking skeleton)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "verso_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri v2 (roadmap, Phase 2 item 2.2). No fs plugin: the only way to a
# note is verso-core (ADR 0026 rule 5). The dialog plugin is the native
# folder picker, the entry edge where a path is a string (rule 4).
# tauri-specta generates the TypeScript bindings from the commands (ADR
# 0038, decided 2026-09-22: specta); the three specta crates are pinned
# together because they are release candidates.
[dependencies]
verso-core = { path = "../../crates/verso-core" }
verso-contract = { path = "../../crates/verso-contract" }
# The open folders and the contract's commands over them, shared with
# `verso serve` (ADR 0073 item 2, decided 2026-10-09).
verso-service = { path = "../../crates/verso-service" }
# The adapters of sync with a cloud (ADR 0104 item 3, C.17): WebDAV and S3
# over the remote trait of verso-core. Host-side: neither verso-core nor
# verso-fs depends on it.
verso-cloud = { path = "../../crates/verso-cloud" }
# The secrets of a cloud — a WebDAV password, an S3 secret key — in the
# system's keychain, never in the folder, the configuration or a log (ADR
# 0104 item 14, ADR 0019): macOS Keychain, Windows Credential Manager, the
# Linux Secret Service (MIT OR Apache-2.0). It replaces nothing of ours:
# the app kept no secret in the system's store before.
keyring = "4"
# `unstable`: child web views — a web note shows its page inside its tab
# (ADR 0049, asked for by the maintainer on 2026-09-23). `devtools`: the
# window's console in the installed app too, View › Open console (ADR 0051,
# 2026-09-30); on macOS it goes through a private API, which only matters
# to the App Store.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
# One app per user: a second launch — `verso <folder>`, a double click on
# the app while it runs — hands its folder to the running app, which opens
# it in a window of its own (ADR 0042, revised 2026-10-08). Tauri's own
# plugin (MIT OR Apache-2.0); it replaces nothing of ours: without it,
# Windows and Linux started a second app, and macOS too when a binary was
# run directly.
tauri-plugin-single-instance = "2"
# The system's notifications (ADR 0084 item 9, decided 2026-10-14): a
# notification also said by the system while the window is not in front,
# on macOS, Windows and Linux, the permission asked when the person turns
# it on. Tauri's own plugin (Apache-2.0 OR MIT); it replaces nothing of
# ours: the app had no way to reach the system's notifications. Held at
# 2.4, the last that runs on this app's Tauri 2.11 (2.5 and later ask for
# 2.12), with its twin `@tauri-apps/plugin-notification` 2.4.x in
# app/ui; on Linux it talks D-Bus through zbus, already in the tree.
tauri-plugin-notification = "~2.4.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A window on a server's folder (ADR 0073 item 2; the maintainer's answer K
# of 2026-10-09): the contract over the server's WebSocket, with the
# system's certificates — already in the tree through the server's axum
# (MIT); tokio is Tauri's own runtime.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "gzip", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# The release files' signatures (ADR 0055, revised 2026-10-09): minisign,
# as `tauri signer` writes them; the verifier Tauri's own updater uses.
minisign-verify = "0.2"
base64 = "0.22"
# A sync conflict's copy is named with the local date and time (ADR 0079
# item 8): the system's time zone, which std does not read. Already in the
# tree through rmcp, with the same feature (MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The embedded terminal (ADR 0115 item 2, accepted 2026-10-31): a shell of
# this computer on a pseudo-terminal — `openpty` on macOS and Linux, ConPTY
# on Windows — WezTerm's crate (MIT). It replaces what would otherwise be
# our own bindings to openpty/ioctl and to CreatePseudoConsole, which need
# `unsafe` in this tree (forbidden but in src/web_clip, ADR 0029). It
# brings `serial2` (serial ports, MIT OR Apache-2.0), not optional in 0.9
# and never called here; `nix` 0.28 beside the tree's 0.31; on Windows
# `winreg` 0.10 and `shared_library` — all under licences cargo-deny
# already allows.
portable-pty = "0.9"

# "This app is a server" (ADR 0096): the desktop starts the same service
# `verso serve` runs, in this process, on the local network, on every system
# (Windows too, ADR 0096 item 17 revised 2026-10-15). Already a
# dev-dependency of the tests of a window on a server.
verso-server = { path = "../../crates/verso-server" }

# The menu-bar mark of "this app is a server" (src/tray.rs; ADR 0096 item 1,
# built on 2026-10-15): Tauri's own tray API, on macOS and Windows only. Not
# on Linux: its tray loads libayatana-appindicator at run time, a native
# library the packages do not depend on and that GNOME does not show without
# an extension. `tray-icon` is Tauri's own feature (tray-icon 0.24.2 and
# muda 0.19.3 are already in the lockfile); it replaces nothing of ours. The
# mark is shipped as raw RGBA, so that `image-png` and the `image` crate it
# pulls in stay out of the tree.
# The Opus encoder of Share audio (ADR 0116 item 18): safe Rust bindings to
# libopus (MIT OR Apache-2.0; libopus itself BSD-3-Clause, built from source
# by its -sys crate, no system package needed). It replaces nothing of ours:
# the app had no audio codec. The decoder in the window is WASM; this crate's
# decoder is used by the host tests only.
opus = "0.4"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri = { version = "2", features = ["unstable", "devtools", "tray-icon"] }

[target.'cfg(unix)'.dependencies]
# Closing a terminal hangs up its shell's process group and the terminal's
# foreground group, then kills them (ADR 0115 item 13): `killpg`, safe,
# from the `nix` already in the tree (0.31, MIT, through verso-fs) with its
# `signal` feature. It replaces a `libc::killpg` of our own, which would
# need `unsafe`.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Clearing the download quarantine from the CLI binary and an extracted
# update, without shelling out to `xattr` (ADR 0029, the subprocess rule).
xattr = "1.6"
# An embedded page clipped as an iframe is (src/web_clip/macos.rs; ADR
# 0056 and ADR 0029, revisions of 2026-10-15): the page's WKWebView moved
# into an NSView that clips to its bounds. AppKit's bindings that wry and
# tao already build, at the versions in the lockfile (objc2 0.6.4,
# objc2-foundation and objc2-app-kit 0.3.2; MIT), with features they
# already enable but NSUserInterfaceItemIdentification. They replace
# nothing of ours: the window had no way to clip a native view.
# objc2-quartz-core (0.3.2, MIT, already in the lockfile through
# objc2-app-kit) is a direct dependency for one call: the container's
# layer masks to its bounds (`CALayer.masksToBounds`, macOS 10.5 and up),
# because `NSView.clipsToBounds` is public only from macOS 14 and the app
# supports macOS 11 and up. It replaces nothing of ours.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSString", "NSGeometry", "NSArray", "NSDictionary", "NSValue", "NSUUID", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView", "NSGraphics", "NSUserInterfaceItemIdentification", "objc2-quartz-core", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
# Share audio on the Mac (src/audio_share/macos.rs; ADR 0116 item 17,
# Q9 decided (a) 2026-10-31): Core Audio's process taps, which no safe Rust
# crate serves (the evaluation is in ADR 0116, "As built (S7)"). The
# bindings are objc2's (objc2-core-audio and objc2-core-audio-types 0.3.2,
# Zlib OR Apache-2.0 OR MIT; objc2-core-foundation for the dictionary the
# aggregate device takes, already in the tree; block2 0.6 for the IOProc block, MIT, and libc
# for the parent of a process, MIT OR Apache-2.0, both already in the
# tree). They replace hand-written `extern "C"` declarations of ours.
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
block2 = "0.6"
# Which pages play now, for the source's name (src/audio_share/macos.rs;
# S10): WKWebView's public `requestMediaPlaybackState` (macOS 12 and up).
# objc2-web-kit 0.3.2 (Zlib OR Apache-2.0 OR MIT) is already in the lockfile
# through tauri/wry; this only names it directly. It replaces nothing of ours.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The same on Windows (src/web_clip/windows.rs): WebView2's host window
# moved into a clipping child window. The Win32 and WebView2 bindings wry
# and Tauri already build, at the lockfile's versions (windows 0.61.3,
# webview2-com 0.38.2; MIT OR Apache-2.0, MIT); they replace nothing of
# ours.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
webview2-com = "0.38"
# A terminal's shell and everything it starts are in a Job Object that kills
# its tree when its handle closes — the terminal's end, or the app's, a
# crash included (ADR 0115 item 13; ADR 0111 item 6's rule). A safe API
# over the job calls (MIT OR Apache-2.0), on the `windows` 0.61 already in
# the tree; it replaces our own CreateJobObject/AssignProcessToJobObject
# calls, which would need `unsafe` outside src/web_clip.
win32job = "2"
# Share audio on Windows (src/audio_share/windows*.rs; ADR 0116 item 17,
# "As built (S8)"). `wasapi` 0.26 (MIT) is a safe API over WASAPI, with the
# process loopback of Windows 11 (`AudioClient::new_application_loopback_client`,
# ActivateAudioInterfaceAsync) and the event-driven capture; it replaces our
# own COM/WASAPI calls, which would need `unsafe`. It is the only new crate:
# the Win32 and WebView2 calls we make ourselves (the build of Windows, the
# browser process of the pages' WebView2, whether a page plays audio) use the
# `windows` 0.61 and `webview2-com` above, in src/audio_share/windows.rs.
wasapi = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
# The same on Linux (src/web_clip/linux.rs), with GTK's safe API: the GTK
# bindings Tauri already builds (gtk 0.18.2, MIT); they replace nothing of
# ours.
gtk = "0.18"
# The web process of the window died (src/recover.rs): WebKitGTK's
# `web-process-terminated` signal, reached through `with_webview`; the
# binding wry already builds (2.0.2, MIT), at the feature (v2_20) that has
# the signal. It replaces nothing of ours.
webkit2gtk = { version = "2", features = ["v2_20"] }
# Share audio on Linux (src/audio_share/linux*.rs; ADR 0116 item 17,
# "As built (S9)"). `procfs` 0.17 (MIT OR Apache-2.0) reads /proc safely (a
# process's name, parent, open files and mappings), to tell the pages'
# WebKitWebProcess from every other process; it replaces our own /proc
# reading, which `std::fs` (denied outside the declared files, ADR 0029)
# could not do. Its default features (chrono, flate2) are off.
procfs = { version = "0.17", default-features = false }

[dev-dependencies]
# The tests read back what a command wrote through the one crate that reads
# a folder (ADR 0029: std::fs stays out of this crate, tests included). In
# the tree already, under verso-core; it replaces nothing of ours.
verso-fs = { path = "../../crates/verso-fs" }
# The fakes of a WebDAV server and an S3 service the sync tests run against
# (ADR 0104, Consequences: no test reaches a real provider).
verso-cloud = { path = "../../crates/verso-cloud", features = ["fake"] }
# A synced folder's live notes (ADR 0082 item 16): the tests' tabs are Yjs
# documents, as the window's, and the feature's guardrail is a property
# test. Both already in the tree, at these versions, through verso-server
# (yrs, MIT) and verso-core (proptest, MIT OR Apache-2.0); they replace
# nothing of ours.
yrs = "0.28"
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The commands exercised through Tauri's mock runtime, as the UI calls
# them (ADR 0029: the contract's guardrail runs without a window).
tauri = { version = "2", features = ["unstable", "test"] }
serde_json = "1"
tempfile = "3.27"
# The signed checksums list's tests (ADR 0055, revised 2026-10-14) sign
# with a throwaway minisign key made in the test, never the release key:
# an Ed25519 key and BLAKE2b-512, minisign's prehash. Both already in the
# tree at these versions, under licences cargo-deny already passes —
# ring (Apache-2.0 AND ISC) through reqwest's rustls, blake2 (MIT OR
# Apache-2.0) through verso-server's argon2; tests only, nothing shipped.
ring = "0.17"
blake2 = "0.10"
# The DNS fallback's TLS tests (ADR 0097): a server with a certificate for
# a name, reached through an address the DNS gave, must be verified for the
# name; the certificate is made in the test (rcgen, MIT OR Apache-2.0) and
# served by rustls on ring (Apache-2.0 OR ISC OR MIT). Both already in the
# tree through verso-server and reqwest; tests only, nothing shipped.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The workspace's lints, written out rather than inherited, for one
# difference: `unsafe_code` is `deny` here, not `forbid`, so that the two
# files of src/web_clip that clip an embedded page natively can allow it
# (ADR 0029, revision of 2026-10-15, the maintainer's decision "A e B
# juntos"). A `forbid` cannot be allowed anywhere, and Cargo cannot
# inherit the workspace's lints but one. scripts/check-unsafe.mjs holds
# this table to the workspace's and `unsafe` to those two files. Every
# `unsafe` block says why it is sound (`undocumented_unsafe_blocks`) and
# does one unsafe thing (`multiple_unsafe_ops_per_block`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
disallowed_methods = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"

[features]
# Lists the audio-sharing test tone (a 440 Hz sine, ADR 0116 item 17) in a
# release build too. Debug builds list it already. No workflow sets this:
# the shipped app never shows a test source.
test-tone = []
