# verso-app manages the desktop shell, self-update and OS integration.
# Its filesystem work — temporary update downloads, the application
# bundle, the Downloads folder, and (since 2026-10-07, ADR 0004) the web
# view's data carried over once from the former bundle identifier — never
# touches a file of the open folder
# (ADR 0026, rule 5): the folder's files still cross only `verso-core` →
# `verso-fs`. Clippy's disallowed-methods list is per crate, not per
# module, so the confinement here is the grep in `scripts/check.sh`:
# `std::fs` in this crate lives in `src/update.rs`, `src/log.rs` and
# `src/resolv_conf.rs` (the Linux resolver files, ADR 0097: an exception
# that awaits the maintainer's ratification) alone, exactly as `verso-core`
# confines it to `src/sidecar.rs`. (The internet link's files, once
# `src/tunnel/files.rs`, moved with the tunnel into `crates/verso-tunnel`
# in R5, its exception with them: ADR 0117 D14.)
# `src/log.rs` writes the app's diagnostic log in the configuration
# directory — never the open folder — added on 2026-09-29, when the
# maintainer found the app kept no record of its own errors. Declared in the
# PR that adds it and ratified by the maintainer on 2026-10-01 (ADR 0029: an
# exception is the subject of its own declaration, never a silent config
# change; review `docs/review/board.md` §6 item 10).
#
# Clippy does not merge this file with the workspace one, so the test
# allowances are repeated.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = []
