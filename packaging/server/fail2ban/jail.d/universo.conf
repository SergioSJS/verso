# fail2ban's jail for UniVerso, the Verso server (ADR 0083 item 1).
# Installed by the universo .deb and .rpm; with fail2ban installed,
#
#   sudo systemctl enable --now fail2ban
#
# is the whole setup. Ten refused sign-ins from one address (an IPv6 /64)
# in ten minutes ban it for an hour. The numbers are the host's to change:
# edit this file, which an upgrade does not overwrite, or set the same keys
# under [universo] in /etc/fail2ban/jail.local, then
# `sudo systemctl reload fail2ban`.
#
# A household or an office behind one address shares the ban: a member who
# mistypes ten times in ten minutes bans the others for the hour. Add the
# addresses you trust to ignoreip (fail2ban's own option).
#
# The server running in Docker logs to the container's output: with the
# journald logging driver (`logging: driver: journald` in the compose
# file) change journalmatch to CONTAINER_NAME=<the container's name>;
# docs/reference/server-install.md, section 16.

[universo]
enabled = true
filter = universo
backend = systemd
journalmatch = _SYSTEMD_UNIT=universo.service
maxretry = 10
findtime = 10m
bantime = 1h
