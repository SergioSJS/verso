# fail2ban's filter for UniVerso, the Verso server (ADR 0083 item 1).
# Installed by the universo .deb and .rpm at
# /etc/fail2ban/filter.d/universo.conf, beside the jail in
# /etc/fail2ban/jail.d/universo.conf; inert while fail2ban is not installed.
#
# The server writes one line per refused sign-in (a wrong password, a
# passkey refused, a device's wrong poll secret):
#
#   2026-10-13T12:00:00Z WARN sign-in failed from 203.0.113.9 for a***@example.org (3 in a row)
#
# The address is the client's, as the trusted proxy forwarded it: an IPv4
# address whole, an IPv6 address by its /64 (2001:db8:1:2::/64), as the
# server's own delays count it. The filter takes exactly those two shapes —
# <IP4> with no prefix, or <IP6> followed by /64, which fail2ban reads as
# the ban's range (its `cidr` group) and bans the /64 whole — and nothing
# wider: not <SUBNET>, which takes any prefix, so that a line naming
# 0.0.0.0/0 or a /48 bans no one. The words after the level are the server's: a window's lines
# in the same log begin with "window <id> (<account>):", so a member who
# writes these words into the log is never read as a refused sign-in.
#
# fail2ban cuts the time out of a line it reads from a file, leaving the
# space after it; from systemd's journal (the jail's backend) it reads
# "<host> <program>[<pid>]: " before the message, the time still in it.
# The optional parts below are those two, and nothing else.

[Definition]

failregex = ^\s*(?:\S+ \S+: )?(?:\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ )?WARN sign-in failed from (?:<IP4>|<IP6>/(?P<cidr>64)) for \S+ \(\d+ in a row\)$

ignoreregex =
