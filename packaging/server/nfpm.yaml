# The universo .deb and .rpm (ADR 0075 item 2), built by nfpm
# (https://nfpm.goreleaser.com, Apache-2.0) in the release workflow's
# `server` job, once per architecture and format:
#
#   VERSO_ARCH=amd64 VERSO_VERSION=0.7.0 nfpm package \
#     --config packaging/server/nfpm.yaml --packager deb --target out/
#
# run from the repository's root, with the architecture's files staged at
# target/server-stage/ (`verso`, the static binary, and `ui/`, the window
# without its *.map files). VERSO_ARCH takes Go's names (amd64, arm64),
# which nfpm turns into each format's own (amd64/arm64 for the .deb,
# x86_64/aarch64 for the .rpm). A version like 0.7.0-beta.1 becomes
# 0.7.0~beta.1 in both formats, so that it sorts before 0.7.0.
#
# The service is installed and NOT started: the host edits
# /etc/universo/universo.env first (postinstall.sh says so).

name: universo
arch: ${VERSO_ARCH}
platform: linux
version: ${VERSO_VERSION}
version_schema: semver
release: 1
section: net
priority: optional
# The maintainer's address, as their GitHub profile already shows it
# (decided by the maintainer on 2026-10-10).
maintainer: Sérgio J. Sousa <sergiosjs@pm.me>
description: |-
  UniVerso, the Verso server
  The Verso core without a window, served to a browser: Markdown notes
  compatible with Obsidian's folders, self-hosted, with accounts and shared
  folders. Runs as a systemd service under the universo user.
vendor: Verso
homepage: https://github.com/SergioSJS/verso
license: MPL-2.0

contents:
  - src: target/server-stage/verso
    dst: /usr/bin/universo
    file_info:
      mode: 0755

  - src: target/server-stage/ui/
    dst: /usr/share/universo/ui
    type: tree

  - src: packaging/server/universo.service
    dst: /usr/lib/systemd/system/universo.service
    file_info:
      mode: 0644

  - dst: /etc/universo
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: universo

  # The host's settings: kept on upgrade and removal when edited. It can
  # hold the first admin's password, hence root and the universo group only.
  - src: packaging/server/universo.env
    dst: /etc/universo/universo.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: universo

  # fail2ban's filter and jail for refused sign-ins (ADR 0083 item 1):
  # inert without fail2ban; with it, `systemctl enable --now fail2ban` is
  # the whole setup. Config files, kept on upgrade and removal when the
  # host edited them, as the settings are.
  - src: packaging/server/fail2ban/universo.conf
    dst: /etc/fail2ban/filter.d/universo.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: packaging/server/fail2ban/jail.d/universo.conf
    dst: /etc/fail2ban/jail.d/universo.conf
    type: config|noreplace
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/universo/LICENSE
    file_info:
      mode: 0644

# /var/lib/universo and its two directories are made by postinstall.sh, not
# listed here: a directory a package owns is removed with it, and these
# hold the host's data.
scripts:
  preinstall: packaging/server/preinstall.sh
  postinstall: packaging/server/postinstall.sh
  preremove: packaging/server/preremove.sh
  postremove: packaging/server/postremove.sh

# The `universo` user and group are made with groupadd and useradd: the
# passwd package on Debian and Ubuntu (priority required) and shadow-utils
# on Fedora and RHEL, present on every install, so no dependency is
# declared. nfpm reads this file strictly: an unknown key fails the build.
rpm:
  summary: UniVerso, the Verso server
  group: Applications/Text
