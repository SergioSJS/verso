# Verso workspace. Five crates, one boundary each (ADR 0028).
#
# Guardrails of the workspace live here and in clippy.toml / deny.toml
# (ADR 0029). They are enforced by CI with `cargo clippy -- -D warnings`;
# nothing in a crate may `#[allow]` them (CLAUDE.md §3).

[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
# The fuzz harnesses are dev tools on nightly, never shipped; each is its own
# package (see its Cargo.toml). Run with `cargo +nightly fuzz` inside the crate.
exclude = ["crates/verso-dialect/fuzz", "crates/verso-server/fuzz"]

[workspace.package]
version = "0.8.5-beta.1"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/SergioSJS/verso"
publish = false

[workspace.lints.rust]
# Memory corruption is not a class of bug this project accepts.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A panic takes the whole app down with the user's notes open.
# Allowed only in tests: see allow-unwrap-in-tests in clippy.toml. `forbid`, not
# `deny`: a local `#[allow]` cannot override it (CLAUDE.md §3).
unwrap_used = "forbid"
expect_used = "forbid"
# std::fs is denied outside verso-fs; the list is in clippy.toml
# (ADR 0026, rule 5, delimited scope).
disallowed_methods = "forbid"

# pulldown-cmark 0.13.4 panics on one input and takes exponential time on
# another (ADR 0037, Consequences; docs/review/phase-1-feature-1.md). Both
# are fixed on upstream main and unreleased since 0.13.4 (2026-05-20). The
# maintainer decided on 2026-09-21 to build from that revision until the
# next release. Remove this block, the allow-git entry and the ban in
# deny.toml together, once a release passes the two regression tests in
# crates/verso-dialect/tests/regressions.rs. Expires 2026-12-31: if no
# release by then, reconsider (ADR 0029, exception policy).
[patch.crates-io]
pulldown-cmark = { git = "https://github.com/pulldown-cmark/pulldown-cmark", rev = "c51a2a4cd8ed07a4b1467cc546edcc51eff40703" }
# tao 0.35.3 returns a UISceneConfiguration it has just released when iOS
# connects a scene: a release build of the iOS app crashes at launch
# (SIGSEGV in objc_retain; ADR 0119 Phase 0, the maintainer's iPad,
# 2026-11-12). Fixed upstream in this revision (tauri-apps/tao#1245,
# "use autorelease_ptr to fix UISceneConfiguration crash"), still 0.35.3,
# in no release of the 0.35 line Tauri 2.11 pins. It also carries the ten
# upstream commits between 0.35.3 and the fix (Windows input and window
# subclassing, Linux synchronisation and Wayland decorations, iPadOS 26's
# window controls). The maintainer's decision of 2026-11-12 ("vamos de
# recomendado"). Remove it, the allow-git entry and the ban in deny.toml
# together once Tauri moves to a tao that carries the fix (0.36 or later).
# Expires 2026-12-31: if no such Tauri by then, reconsider (ADR 0029).
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }

# The password hash compiled with optimisations in debug builds too: Argon2 is
# slow on purpose through its parameters (memory and passes), which stay the
# same; an unoptimised build only made the server's tests many times slower
# (13 minutes on Windows, 2026-10-22) and protected nothing. Verso's own code
# keeps the debug profile.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# The iOS release archive: the Swift halves of Tauri and of its plugins
# (`register_plugin`, `init_plugin_*`, `log_stdout`, `on_webview_created`)
# are built by swift-rs in the configuration Cargo's `DEBUG` names, and in
# Swift's release configuration (Xcode 27's toolchain) their `@_cdecl`
# symbols come out local, so the app's binary cannot link them (ADR 0119,
# the first release `.ipa`, 2026-11-12). Line tables only in these four
# crates turn `DEBUG` on for their build scripts: their Swift is built as in
# a debug build, exported; the Rust stays optimised. Elsewhere the four
# crates' release builds only carry line tables.
[profile.release.package.tauri]
debug = "line-tables-only"
[profile.release.package.tauri-plugin-dialog]
debug = "line-tables-only"
[profile.release.package.tauri-plugin-notification]
debug = "line-tables-only"
[profile.release.package.tauri-plugin-opener]
debug = "line-tables-only"
