# Releases (ADR 0051 as revised on 2026-10-02, ADR 0029): the apps are built
# and packaged here and nowhere else, only for a version — `vX.Y.Z` for
# production, `vX.Y.Z-beta.N` for a test release. A version reaches main in
# the pull request that carries it (`node scripts/release.mjs prepare` on
# its branch); on that push to main, `decide` sees a version with no tag
# yet, the macOS, Windows, Linux and server jobs build it, and `publish`
# publishes the release with all of them, which creates the tag on the
# merge; then `server-image` pushes the server's image. A version is
# published whole or not at all: when one platform fails, nothing is
# published, and a run again (Actions → Re-run failed jobs) finishes it.
# Every other push to main stops at `decide`, a few
# seconds of Linux. A tag pushed by hand (`release.mjs tag`, when the
# automatic path could not tag) still releases. Branches and pull requests
# never build or package the app.
#
# A rehearsal (Actions → release → Run workflow) builds the same files from
# `main` without publishing anything and keeps them as run artifacts: the
# way to see this workflow work before its first real tag, which cannot be
# taken back once published.
#
# macOS, arm64 (ADR 0022), and since its port Windows, x64 (ADR 0069 item
# 6): an NSIS installer per user, unsigned (ADR 0069), with `verso.exe`
# beside the app; and Linux, x64 (ADR 0071; ARM64 once the repository is
# public): an AppImage, a
# `.deb` and an `.rpm`, built on Ubuntu 22.04 so they run on the oldest
# base supported. A test release is
# built as "Verso Beta", with an identifier of its own, so that it installs
# beside the production app with its own window settings, and its command
# line opens that app. The app is signed ad hoc, not with a Developer ID:
# macOS asks once, on first open, to allow it (README.md); a Developer ID is
# a decision for before public distribution.
#
# The server (ADR 0075): `verso serve`, static for x64 and ARM64 (ARM64
# cross-compiled, ADR 0075 item 2), as an archive, a `.deb` and an `.rpm`
# with a systemd unit, signed like the apps; and an image for amd64 and
# arm64 on GitHub's registry (ghcr.io/sergiosjs/verso), pushed after the
# release is published (packaging/server/).
#
# Cost: one macOS job, about ten minutes, each billed as ten Linux ones; one
# Windows job, about fifteen, each billed as about two; one Linux job, x64,
# about twenty minutes (estimated: not run yet); the server, two Linux
# jobs, about twenty-five minutes and five (estimated: not run yet); a
# minute of Linux to publish.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Two merges in a row wait for each other: the second one's `decide` then
# sees the tag the first one created.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Is there a version to release? On main: the workspace's version, unless
  # its tag exists already. On a tag: that tag. By hand: a rehearsal.
  decide:
    name: a version to release?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$EVENT:$REF_TYPE" in
            push:tag) tag="$GITHUB_REF_NAME" ;;
            push:branch)
              version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
              if [ -z "$version" ] || [ "$version" = 0.0.0 ]; then
                echo "main carries no version to release"; tag=""
              elif out="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1)"; then
                echo "v$version is released already: nothing to do"; tag=""
              elif printf '%s' "$out" | grep -q "HTTP 404"; then
                echo "v$version has no tag yet: releasing it"; tag="v$version"
              else
                echo "::error::could not ask GitHub for v$version: $out"; exit 1
              fi ;;
            *) tag="rehearsal" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: Verso for macOS (${{ needs.decide.outputs.tag }})
    needs: decide
    if: needs.decide.outputs.tag != ''
    runs-on: macos-latest
    # Builds only: no write token for a build step (publish has it).
    permissions:
      contents: read
    steps:
      # The whole history, for the check that a tag sits on main; and no
      # token left behind for the build steps — only the publish step gets
      # one, through GH_TOKEN.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Before any build: the tag names the version the sources carry, in
      # the shape of a version, with its changelog in both languages, on a
      # commit that is on main. A rehearsal builds main's version as a beta.
      - name: what is released
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/release.mjs verify "$TAG"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG is not on main"
              exit 1
            fi
            version="${TAG#v}"
          else
            version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$EVENT:$version" in
            push:*-beta.*|workflow_dispatch:*) echo "beta=true" >> "$GITHUB_OUTPUT"; echo "name=Verso Beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "beta=false" >> "$GITHUB_OUTPUT"; echo "name=Verso" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: the UI bundle
        working-directory: app/ui
        run: npm ci && npm run build
      - name: the app
        env:
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            npm --prefix app/ui exec -- tauri build --bundles app \
              --config '{"identifier":"com.versomd.app.beta","productName":"Verso Beta"}'
          else
            npm --prefix app/ui exec -- tauri build --bundles app
          fi
      - name: the command line
        env:
          VERSO_APP_NAME: ${{ steps.version.outputs.name }}
        run: cargo build --release --locked -p verso-cli
      # The command line travels inside the app too, beside its binary, where
      # the settings' "Install" links it from (ADR 0054); the bundle is
      # signed again, ad hoc as before, so that its seal covers it.
      - name: the command line inside the app
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          cp target/release/verso "target/release/bundle/macos/$NAME.app/Contents/MacOS/verso"
          codesign --force --deep --sign - "target/release/bundle/macos/$NAME.app"
          codesign --verify --deep --strict "target/release/bundle/macos/$NAME.app"
      # ditto keeps the app's signature and extended attributes in the zip.
      - name: the release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          slug="$(printf '%s' "$NAME" | tr ' ' '-')"
          ditto -c -k --keepParent "target/release/bundle/macos/$NAME.app" "$slug-$VERSION-macos-arm64.zip"
          tar -czf "verso-cli-$VERSION-macos-arm64.tar.gz" -C target/release verso
      # Each file signed with Verso's release key (ADR 0055, revised
      # 2026-10-09): the app installs an update only when its `.sig`
      # verifies against the public key it carries. The key reaches only
      # this step, from the repository's secrets.
      - name: sign the release's files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ./*-macos-arm64.zip ./verso-cli-*-macos-arm64.tar.gz; do
            npm --prefix app/ui exec -- tauri signer sign "$f"
            test -s "$f.sig"
          done
      # Checked as the app checks them, with the key it carries: a secret
      # that is not that key stops the release here, before it is published
      # (a published release is permanent).
      - name: verify the signatures with the app's key
        run: target/release/verso-app --verify-signature ./*-macos-arm64.zip ./verso-cli-*-macos-arm64.tar.gz
      - name: keep the files for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-arm64
          if-no-files-found: error
          path: |
            ./*-macos-arm64.zip
            ./*-macos-arm64.zip.sig
            ./verso-cli-*-macos-arm64.tar.gz
            ./verso-cli-*-macos-arm64.tar.gz.sig

  windows:
    name: Verso for Windows (${{ needs.decide.outputs.tag }})
    needs: decide
    if: needs.decide.outputs.tag != ''
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # The UI's build is a POSIX script (rm, cp, mkdir): npm runs it in Git's
      # bash, not in cmd.exe.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    steps:
      # Before the checkout: the runner's Git converts line endings, and the
      # demo vault and the fixtures are about bytes (invariant 7).
      - name: no line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The same checks as macOS's, before any build.
      - name: what is released
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/release.mjs verify "$TAG"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG is not on main"
              exit 1
            fi
            version="${TAG#v}"
          else
            version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$EVENT:$version" in
            push:*-beta.*|workflow_dispatch:*) echo "beta=true" >> "$GITHUB_OUTPUT"; echo "name=Verso Beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "beta=false" >> "$GITHUB_OUTPUT"; echo "name=Verso" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: the UI bundle
        working-directory: app/ui
        run: npm ci && npm run build
      # The command line first: the installer carries it beside the app
      # (Tauri's externalBin, named with the target), and "Add to Claude"
      # writes its path (ADR 0069, 2026-10-08). Given at bundle time, as
      # scripts/check-windows.sh --bundle gives it.
      - name: the command line
        env:
          VERSO_APP_NAME: ${{ steps.version.outputs.name }}
        run: |
          cargo build --release --locked -p verso-cli
          mkdir -p app/src-tauri/binaries
          cp target/release/verso.exe app/src-tauri/binaries/verso-x86_64-pc-windows-msvc.exe
      - name: the installer
        env:
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            conf='{"identifier":"com.versomd.app.beta","productName":"Verso Beta","bundle":{"externalBin":["binaries/verso"]}}'
          else
            conf='{"bundle":{"externalBin":["binaries/verso"]}}'
          fi
          printf '%s' "$conf" > bundle.conf.json
          npm --prefix app/ui exec -- tauri build --bundles nsis --config bundle.conf.json
      # Named as the updater looks for them: the OS, the architecture, the
      # extension (app/src-tauri/src/update.rs, pick_asset).
      - name: the release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          slug="$(printf '%s' "$NAME" | tr ' ' '-')"
          shopt -s nullglob
          exes=(target/release/bundle/nsis/*-setup.exe)
          if [ "${#exes[@]}" -ne 1 ]; then echo "::error::expected one installer, found: ${exes[*]}"; exit 1; fi
          cp "${exes[0]}" "$slug-$VERSION-windows-x64-setup.exe"
          pwsh -NoProfile -Command "Compress-Archive -Path target/release/verso.exe -DestinationPath verso-cli-$VERSION-windows-x64.zip"
      - name: sign the release's files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ./*-windows-x64-setup.exe ./verso-cli-*-windows-x64.zip; do
            npm --prefix app/ui exec -- tauri signer sign "$f"
            test -s "$f.sig"
          done
      - name: verify the signatures with the app's key
        run: target/release/verso-app.exe --verify-signature ./*-windows-x64-setup.exe ./verso-cli-*-windows-x64.zip
      - name: keep the files for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          if-no-files-found: error
          path: |
            ./*-windows-x64-setup.exe
            ./*-windows-x64-setup.exe.sig
            ./verso-cli-*-windows-x64.zip
            ./verso-cli-*-windows-x64.zip.sig

  # Linux (ADR 0071, items 2, 3 and 6): one build per architecture on the
  # oldest base of the family, Ubuntu 22.04 (glibc 2.35), so the packages run
  # there and later, on Debian 12 and on current Fedora — x64 only for now:
  # ARM64 waits until the repository is public, since GitHub's ARM runners
  # (`ubuntu-22.04-arm`) are for public repositories, and one runner that
  # never comes would hold every platform's publish (the maintainer,
  # 2026-10-09). Its matrix entry, when it comes back: arch aarch64, runner
  # ubuntu-22.04-arm, triple aarch64-unknown-linux-gnu, deb arm64; and the
  # publish job's count grows by 8. A beta installs beside the release:
  # its binary is `verso-app-beta` and its command line `verso-beta`, or the
  # two packages would fight over /usr/bin.
  linux:
    name: Verso for Linux ${{ matrix.arch }} (${{ needs.decide.outputs.tag }})
    needs: decide
    if: needs.decide.outputs.tag != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            deb: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: what is released
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/release.mjs verify "$TAG"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG is not on main"
              exit 1
            fi
            version="${TAG#v}"
          else
            version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$EVENT:$version" in
            push:*-beta.*|workflow_dispatch:*) echo "beta=true" >> "$GITHUB_OUTPUT"; echo "name=Verso Beta" >> "$GITHUB_OUTPUT"; echo "bin=verso-app-beta" >> "$GITHUB_OUTPUT"; echo "cli=verso-beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "beta=false" >> "$GITHUB_OUTPUT"; echo "name=Verso" >> "$GITHUB_OUTPUT"; echo "bin=verso-app" >> "$GITHUB_OUTPUT"; echo "cli=verso" >> "$GITHUB_OUTPUT" ;;
          esac
      # What Tauri needs on Linux (its prerequisites page), and rpm for the
      # `.rpm`.
      - name: the system's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm file
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: the UI bundle
        working-directory: app/ui
        run: npm ci && npm run build
      - name: the command line
        env:
          VERSO_APP_NAME: ${{ steps.version.outputs.name }}
          CLI: ${{ steps.version.outputs.cli }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          cargo build --release --locked -p verso-cli
          mkdir -p app/src-tauri/binaries
          cp target/release/verso "app/src-tauri/binaries/$CLI-$TRIPLE"
      - name: the packages
        env:
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            conf='{"identifier":"com.versomd.app.beta","productName":"Verso Beta","mainBinaryName":"verso-app-beta","bundle":{"externalBin":["binaries/verso-beta"]}}'
          else
            conf='{"bundle":{"externalBin":["binaries/verso"]}}'
          fi
          printf '%s' "$conf" > bundle.conf.json
          npm --prefix app/ui exec -- tauri build --bundles deb,rpm,appimage --config bundle.conf.json
      # Named as the updater looks for them: the version, the OS, the
      # architecture, the format (app/src-tauri/src/update.rs, pick_asset).
      - name: the release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
          ARCH: ${{ matrix.arch }}
          DEB: ${{ matrix.deb }}
        run: |
          slug="$(printf '%s' "$NAME" | tr ' ' '-')"
          shopt -s nullglob
          # By extension: Tauri leaves its working folder beside each
          # package (`Verso Beta_0.6.0-beta.1_amd64/`, `Verso.AppDir/`).
          one() { if [ "$#" -ne 1 ]; then echo "::error::expected one package, found: $*"; exit 1; fi; }
          one target/release/bundle/deb/*.deb
          one target/release/bundle/rpm/*.rpm
          one target/release/bundle/appimage/*.AppImage
          cp target/release/bundle/deb/*.deb "$slug-$VERSION-linux-$DEB.deb"
          cp target/release/bundle/rpm/*.rpm "$slug-$VERSION-linux-$ARCH.rpm"
          cp target/release/bundle/appimage/*.AppImage "$slug-$VERSION-linux-$ARCH.AppImage"
          tar -czf "verso-cli-$VERSION-linux-$ARCH.tar.gz" -C target/release verso
      - name: sign the release's files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ./*-linux-*.deb ./*-linux-*.rpm ./*-linux-*.AppImage ./verso-cli-*-linux-*.tar.gz; do
            npm --prefix app/ui exec -- tauri signer sign "$f"
            test -s "$f.sig"
          done
      - name: verify the signatures with the app's key
        env:
          BIN: ${{ steps.version.outputs.bin }}
        run: |
          "target/release/$BIN" --verify-signature ./*-linux-*.deb ./*-linux-*.rpm ./*-linux-*.AppImage ./verso-cli-*-linux-*.tar.gz
      - name: keep the files for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ./*-linux-*.deb
            ./*-linux-*.deb.sig
            ./*-linux-*.rpm
            ./*-linux-*.rpm.sig
            ./*-linux-*.AppImage
            ./*-linux-*.AppImage.sig
            ./verso-cli-*-linux-*.tar.gz
            ./verso-cli-*-linux-*.tar.gz.sig

  # The server (ADR 0075 item 2): `verso serve` is a subcommand of the
  # `verso` binary, built here without the window, static (musl), for x64
  # and ARM64 — ARM64 cross-compiled on this x86-64 runner with
  # cargo-zigbuild, since the repository is private and has no ARM runner
  # (decided: the server's ARM64 now, ADR 0075 item 2). Three forms from
  # that binary: an archive and a .deb and .rpm per architecture, published
  # with the release and signed as the apps are (ADR 0055); and the image,
  # pushed by `server-image` once the release is published. The window's
  # files (app/ui/dist) go without their *.map files.
  #
  # The files are named `verso-server-<version>-<arch>.<ext>`, with no OS
  # word in the name: the desktop app's updater picks a release file by OS,
  # architecture and extension (app/src-tauri/src/update.rs, pick_asset),
  # and a `linux` in a server .deb's name would let the Linux app take the
  # server for its own update.
  server:
    name: Verso server (${{ needs.decide.outputs.tag }})
    needs: decide
    if: needs.decide.outputs.tag != ''
    # 24.04 for minisign, in its archive since 24.04; the binaries are
    # static, so the runner's C library does not matter.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The same checks as the other platforms', before any build.
      - name: what is released
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/release.mjs verify "$TAG"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG is not on main"
              exit 1
            fi
            version="${TAG#v}"
          else
            version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$EVENT:$version" in
            push:*-beta.*|workflow_dispatch:*) echo "name=Verso Beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=Verso" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: toolchain from rust-toolchain.toml, and the two musl targets
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Zig as the C compiler and linker for both targets (SQLite and ring
      # have C), from PyPI with cargo-zigbuild; versions pinned.
      - name: zig and cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --disable-pip-version-check cargo-zigbuild==0.23.4 ziglang==0.15.2
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$RUNNER_TEMP/zig/bin/python3" >> "$GITHUB_ENV"
      # nfpm (Apache-2.0) for the .deb and the .rpm, pinned by version and
      # checksum.
      - name: nfpm
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: minisign, to check the signatures
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: the UI bundle
        working-directory: app/ui
        run: npm ci && npm run build
      - name: the server's binaries
        env:
          VERSO_APP_NAME: ${{ steps.version.outputs.name }}
        run: |
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p verso-cli --target "$triple"
            info="$(file "target/$triple/release/verso")"
            echo "$info"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::$triple: not a static binary"; exit 1 ;;
            esac
          done
      # Per architecture: the archive (bin/verso and share/verso/ui, where
      # `verso serve` finds the window with no VERSO_UI_DIR, beside the
      # licence, the unit and the settings' template), the .deb and the
      # .rpm. Then the image's build context, laid out as
      # packaging/server/Dockerfile expects it. Each package is found by its
      # extension, one per format, as the Linux job does.
      - name: the release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          one() { if [ "$#" -ne 1 ]; then echo "::error::expected one package, found: $*"; exit 1; fi; }
          rm -rf target/server-ui target/server-image
          mkdir -p target/server-ui
          cp -R app/ui/dist/. target/server-ui/
          find target/server-ui -name '*.map' -delete
          test -f target/server-ui/web.html
          for entry in x86_64:amd64:x86_64-unknown-linux-musl aarch64:arm64:aarch64-unknown-linux-musl; do
            IFS=: read -r arch goarch triple <<< "$entry"
            bin="target/$triple/release/verso"
            rm -rf target/server-stage target/server-pkg
            mkdir -p target/server-stage target/server-pkg target/server-image/bin/"$goarch"
            cp "$bin" target/server-stage/verso
            cp -R target/server-ui target/server-stage/ui
            cp "$bin" target/server-image/bin/"$goarch"/verso
            for packager in deb rpm; do
              VERSO_ARCH="$goarch" VERSO_VERSION="$VERSION" \
                nfpm package --config packaging/server/nfpm.yaml --packager "$packager" --target target/server-pkg/
            done
            one target/server-pkg/*.deb
            one target/server-pkg/*.rpm
            cp target/server-pkg/*.deb "verso-server-$VERSION-$goarch.deb"
            cp target/server-pkg/*.rpm "verso-server-$VERSION-$arch.rpm"
            dir="verso-server-$VERSION-$arch"
            rm -rf "target/$dir"
            mkdir -p "target/$dir/bin" "target/$dir/share/verso"
            cp "$bin" "target/$dir/bin/verso"
            cp -R target/server-ui "target/$dir/share/verso/ui"
            cp LICENSE packaging/server/verso.service packaging/server/verso.env "target/$dir/"
            printf '%s\n' \
              "Verso server $VERSION ($arch, static)." \
              "" \
              "  bin/verso serve        starts it; settings by environment (verso.env lists them)" \
              "  share/verso/ui         the window, found by bin/verso with no VERSO_UI_DIR" \
              "  verso.service          a systemd unit (it expects /usr/bin/verso and /etc/verso/verso.env)" \
              "" \
              "Installing, TLS, backups and updates: docs/reference/server-install.md" \
              "in https://github.com/SergioSJS/verso" > "target/$dir/README.txt"
            tar -czf "$dir.tar.gz" -C target "$dir"
          done
          cp -R target/server-ui target/server-image/ui
          ls -la verso-server-*
      - name: sign the release's files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ./verso-server-*.tar.gz ./verso-server-*.deb ./verso-server-*.rpm; do
            npm --prefix app/ui exec -- tauri signer sign "$f"
            test -s "$f.sig"
          done
      # Checked with the key the app carries, as the other jobs check with
      # `verso-app --verify-signature` — which this job does not build (the
      # window needs WebKit): minisign verifies the same signature, and the
      # signed comment must name the file, as the app requires
      # (update.rs, verify_signature).
      - name: verify the signatures with the app's key
        run: |
          key="$(sed -n 's/^pub(crate) const UPDATE_PUBLIC_KEY: &str = "\(.*\)";$/\1/p' app/src-tauri/src/update.rs)"
          if [ -z "$key" ]; then echo "::error::UPDATE_PUBLIC_KEY not found in update.rs"; exit 1; fi
          printf '%s' "$key" | base64 -d > "$RUNNER_TEMP/verso.pub"
          for f in ./verso-server-*.tar.gz ./verso-server-*.deb ./verso-server-*.rpm; do
            base64 -d < "$f.sig" > "$RUNNER_TEMP/file.minisig"
            comment="$(minisign -V -Q -p "$RUNNER_TEMP/verso.pub" -m "$f" -x "$RUNNER_TEMP/file.minisig")"
            case "$comment" in
              *"file:$(basename "$f")"*) echo "verified: $f" ;;
              *) echo "::error::$f: the signed comment does not name the file: $comment"; exit 1 ;;
            esac
          done
      - name: keep the files for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-server
          if-no-files-found: error
          path: |
            ./verso-server-*.tar.gz
            ./verso-server-*.tar.gz.sig
            ./verso-server-*.deb
            ./verso-server-*.deb.sig
            ./verso-server-*.rpm
            ./verso-server-*.rpm.sig
      # Not `release-*`: the image's context is not a release file.
      - name: keep the image's context for the image job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-context
          if-no-files-found: error
          path: target/server-image/

  # Every platform built: the release is published with their files. On a
  # rehearsal nothing is published; the files stay as the run's artifacts.
  publish:
    name: publish ${{ needs.decide.outputs.tag }}
    needs: [decide, macos, windows, linux, server]
    if: github.event_name == 'push' && needs.decide.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: files
      # A run again after a partial publish replaces the files and the notes
      # instead of failing on a release that already exists. On a push to
      # main the tag does not exist yet: creating the release creates it, on
      # the commit this run built (`--target`). A tag made with the
      # workflow's token starts no other workflow, so nothing runs twice.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          version="${TAG#v}"
          case "$version" in
            *-beta.*) name="Verso Beta"; pre=(--prerelease) ;;
            *) name="Verso"; pre=() ;;
          esac
          node scripts/release.mjs notes "$version" > notes.md
          files=(files/*)
          # macOS 2, Windows 2, Linux 4 (x64; ARM64 waits for a public
          # repository), the server 6 (an archive, a .deb and an .rpm for
          # x64 and for ARM64); each with its signature.
          if [ "${#files[@]}" -ne 28 ]; then echo "::error::expected fourteen files and their signatures, found: ${files[*]}"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$name $version" --notes-file notes.md "${pre[@]}" "${files[@]}"
          fi

  # The server's image (ADR 0075 item 2 and Consequences), for amd64 and
  # arm64, assembled from the binaries `server` built — no emulator — and
  # pushed to GitHub's registry with the workflow's own token, only once
  # the release is published: a version is published whole or not at all,
  # and the image is part of it. A re-run of this job alone finishes it.
  # On a rehearsal the image is built and not pushed.
  #
  # Tags: the version, and `latest` for a production version or `beta` for
  # a test one. Then the old versions are pruned: the free plan stores
  # 500 MB of private packages. Each push makes three package versions —
  # the multi-platform index and one manifest per architecture (provenance
  # and SBOM attestations are off, or there would be more) — so keeping 15
  # keeps the last five releases.
  #
  # While the repository is private the package is private: a host pulls it
  # after `docker login ghcr.io` (docs/reference/server-install.md).
  server-image:
    name: Verso server image (${{ needs.decide.outputs.tag }})
    needs: [decide, server, publish]
    if: ${{ !cancelled() && needs.decide.outputs.tag != '' && needs.server.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sergiosjs/verso
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-image-context
          path: server-image
      - name: the image's tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.server.outputs.version }}
        run: |
          tags="$IMAGE:$VERSION"
          case "$EVENT:$VERSION" in
            push:*-beta.*) tags="$tags,$IMAGE:beta" ;;
            push:*) tags="$tags,$IMAGE:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: sign in to GitHub's registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: server-image
          file: packaging/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
      - name: prune the old versions
        if: github.event_name == 'push'
        # The release is complete by now: a token that may not delete a
        # user's package versions leaves them, it does not fail the run.
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: verso
          package-type: container
          min-versions-to-keep: 15
