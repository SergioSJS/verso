# Releases (ADR 0051, ADR 0029): the apps are built and packaged here and
# nowhere else, only for a version tag — `vX.Y.Z` for production,
# `vX.Y.Z-beta.N` for a test release. `node scripts/release.mjs tag X.Y.Z`
# pushes the tag, when the maintainer asks for a version; branches and pull
# requests never build or package the app.
#
# macOS only, arm64: the platform Phase 2 ships on (ADR 0022). Windows, then
# Linux, get a job of their own when their ports land. A test release is
# built as "Verso Beta", with an identifier of its own, so that it installs
# beside the production app with settings of its own, and its command line
# opens that app. The app is signed ad hoc, not with a Developer ID: macOS
# asks once, on first open, to allow it (README.md); a Developer ID is a
# decision for before public distribution.
#
# Cost: one macOS job, about ten minutes, each billed as ten Linux ones.

name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Verso for macOS (${{ github.ref_name }})
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The tag must name the version the sources carry: a tag pushed by
      # hand on the wrong commit stops here, before anything is built.
      - name: the tag is the workspace's version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "::error::$GITHUB_REF_NAME does not match the workspace version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-beta.*) echo "beta=true" >> "$GITHUB_OUTPUT"; echo "name=Verso Beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "beta=false" >> "$GITHUB_OUTPUT"; echo "name=Verso" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: the UI bundle
        working-directory: app/ui
        run: npm ci && npm run build
      - name: the app
        env:
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            npm --prefix app/ui exec -- tauri build --bundles app \
              --config '{"identifier":"dev.verso.app.beta","productName":"Verso Beta"}'
          else
            npm --prefix app/ui exec -- tauri build --bundles app
          fi
      - name: the command line
        env:
          VERSO_APP_NAME: ${{ steps.version.outputs.name }}
        run: cargo build --release --locked -p verso-cli
      # ditto keeps the app's signature and extended attributes in the zip.
      - name: the release's files and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          slug="$(printf '%s' "$NAME" | tr ' ' '-')"
          ditto -c -k --keepParent "target/release/bundle/macos/$NAME.app" "$slug-$VERSION-macos-arm64.zip"
          tar -czf "verso-cli-$VERSION-macos-arm64.tar.gz" -C target/release verso
          node scripts/release.mjs notes "$VERSION" > notes.md
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          pre=""
          if [ "$BETA" = true ]; then pre="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$NAME $VERSION" --notes-file notes.md $pre \
            ./*-macos-arm64.zip ./verso-cli-*-macos-arm64.tar.gz
