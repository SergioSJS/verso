# CI: workspace guardrails on macOS and Linux (ADR 0029, roadmap item 0.11).
#
# Third-party actions are pinned by commit SHA, not by tag; the tag is in the
# comment for humans. Bumping one is a PR of its own.
#
# The toolchain comes from rust-toolchain.toml: `rustup show` installs the
# pinned version and its components (rustfmt, clippy) on the runner.
#
# `-D warnings` is passed on the clippy command line, not through RUSTFLAGS:
# RUSTFLAGS would apply to dependency crates too, and a dependency that merely
# warns would turn CI red with no fix in this repository.

name: ci

on:
  push:
    branches: ["main", "fase0/**", "phase*", "phase*/**", "test/**"]
  pull_request:

# A PR from a fase0/** branch triggers both events; keep only the latest run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-mirror:
    name: docs mirror and fixtures (ADR 0008, ADR 0031)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash scripts/check-docs-mirror.sh
      - name: fixtures structure and keys (ADR 0031)
        run: bash scripts/check-fixtures.sh

  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # Feature guardrails of Phase 1, feature 1 (ADR 0029). Each one was seen
  # failing before the PR that added it was merged; the PR records how.
  dialect-wasm:
    name: verso-dialect compiles to wasm32 (ADR 0029)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --target wasm32-unknown-unknown -p verso-dialect --locked

  dialect-fuzz:
    # cargo-fuzz needs nightly for its sanitizer; the pinned toolchain in
    # rust-toolchain.toml is bypassed with `+nightly` for this job only.
    # A short run on every PR; the corpus grows in `fuzz/corpus` locally.
    name: verso-dialect fuzz, 60s (ADR 0029)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/verso-dialect/fuzz
      - name: fuzz parse for 60 seconds
        working-directory: crates/verso-dialect
        run: cargo +nightly fuzz run parse -- -max_total_time=60 -max_len=4096
      - name: keep a crash, if any, as an artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: crates/verso-dialect/fuzz/artifacts
          if-no-files-found: ignore

  deny:
    # On both operating systems: ADR 0029 and roadmap exit criterion 3 list
    # `cargo deny check` with the other three, on macOS and Linux.
    name: cargo deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      # cargo-deny-action is a container action and runs on Linux only; the
      # binary is installed instead, so the same check runs on both OSes.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-deny@0.20.2
      # all-features is set in deny.toml ([graph] all-features = true).
      - run: cargo deny check
