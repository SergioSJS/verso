# CI: workspace guardrails on macOS and Linux (ADR 0029, roadmap item 0.11).
#
# Third-party actions are pinned by commit SHA, not by tag; the tag is in the
# comment for humans. Bumping one is a PR of its own.
#
# The toolchain comes from rust-toolchain.toml: `rustup show` installs the
# pinned version and its components (rustfmt, clippy) on the runner.
#
# `-D warnings` is passed on the clippy command line, not through RUSTFLAGS:
# RUSTFLAGS would apply to dependency crates too, and a dependency that merely
# warns would turn CI red with no fix in this repository.

# Cost (2026-09-22): Actions minutes in a private repository are a monthly
# budget and macOS is billed at 10x Linux. One day of pushing to five
# stacked branches, each push running the workflow twice (push and
# pull_request), with macOS on every job, spent the whole month's quota.
# Since then: a branch runs only as a pull request; a push runs only on
# main; macOS runs only on main. A PR is Linux-only; the merge into main is
# where both operating systems are checked (ADR 0029, revision of
# 2026-09-22).

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# One run per PR head; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-mirror:
    name: docs mirror and fixtures (ADR 0008, ADR 0031)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash scripts/check-docs-mirror.sh
      # The fixture lint compares each draft with main: an approval that
      # came undone fails. A shallow checkout has no main; fetch its tip.
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: fixtures structure and keys (ADR 0031)
        run: bash scripts/check-fixtures.sh
        env:
          FIXTURES_BASE: origin/main
          # No draft on main (roadmap, exit criterion 5); a branch may carry one.
          FIXTURES_STRICT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    # macOS only on main: a PR runs on Linux (cost note at the top). The
    # matrix itself is chosen by the ref: a job-level `if` cannot see
    # `matrix`, and GitHub rejects a workflow whose `if` names it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # ADR 0029: verso-core's std::fs exception is the configuration
      # directory alone, written by src/sidecar.rs. Its clippy.toml has to
      # allow the three calls crate-wide (clippy cannot scope a list to one
      # file), so this grep holds the scope to that file. Comment lines are
      # let through: the crate's docs name the lint. `std::fs`, a bare
      # `fs::` and `fs` imported in braces (`use std::{fs, io}`) all count;
      # `verso_fs::` does not. No toolchain needed, so it runs first and
      # fails fast.
      - name: std::fs in verso-core only in src/sidecar.rs (ADR 0029)
        run: |
          if grep -rnE --include='*.rs' '(std::fs|\bfs::|std::\{[^}]*\bfs\b)' crates/verso-core/src \
             | grep -v '^crates/verso-core/src/sidecar.rs:' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo 'std::fs outside crates/verso-core/src/sidecar.rs (ADR 0029)'
            exit 1
          fi
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The workspace now includes the Tauri shell (app/src-tauri, Phase 2),
      # which links against WebKitGTK on Linux; macOS has WebKit built in.
      - name: WebKitGTK for the Tauri shell (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  # Feature guardrails of Phase 1, feature 1 (ADR 0029). Each one was seen
  # failing before the PR that added it was merged; the PR records how.
  dialect-wasm:
    name: verso-dialect compiles to wasm32 (${{ matrix.os }}, ADR 0029)
    # macOS only on main: a PR runs on Linux (cost note at the top). The
    # matrix itself is chosen by the ref: a job-level `if` cannot see
    # `matrix`, and GitHub rejects a workflow whose `if` names it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --target wasm32-unknown-unknown -p verso-dialect --locked

  dialect-fuzz:
    # cargo-fuzz needs nightly for its sanitizer; the pinned toolchain in
    # rust-toolchain.toml is bypassed with `+nightly` for this job only.
    # macOS only on main: a PR runs on Linux (cost note at the top). The
    # matrix itself is chosen by the ref: a job-level `if` cannot see
    # `matrix`, and GitHub rejects a workflow whose `if` names it.
    # A short run on every PR, from the versioned seeds in `fuzz/seeds`
    # (one file per input that once broke something; see the fuzz target's
    # doc); the corpus grows in `fuzz/corpus` locally and is not versioned,
    # so the directory is created here — cargo-fuzz does not create a corpus
    # directory it was given by name. Inputs up to 64 KiB: the 8 KB
    # frontmatter that overflowed the stack was out of reach of the 4 KiB
    # default (review of PR #7, finding 2).
    name: verso-dialect fuzz, 60s (${{ matrix.os }}, ADR 0029)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/verso-dialect/fuzz
      # install-action ships a static (musl) cargo-fuzz on Linux, and
      # cargo-fuzz defaults --target to the platform it was built for; the
      # sanitizer does not link against static musl, so the target is explicit.
      - name: fuzz parse for 60 seconds
        working-directory: crates/verso-dialect
        run: |
          mkdir -p fuzz/corpus/parse
          cargo +nightly fuzz run --target ${{ matrix.target }} parse fuzz/corpus/parse fuzz/seeds -- -max_total_time=60 -max_len=65536 -timeout=20
      - name: keep a crash, if any, as an artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: crates/verso-dialect/fuzz/artifacts
          if-no-files-found: ignore

  deny:
    # On both operating systems: ADR 0029 and roadmap exit criterion 3 list
    # `cargo deny check` with the other three, on macOS and Linux.
    name: cargo deny (${{ matrix.os }})
    # macOS only on main: a PR runs on Linux (cost note at the top). The
    # matrix itself is chosen by the ref: a job-level `if` cannot see
    # `matrix`, and GitHub rejects a workflow whose `if` names it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      # cargo-deny-action is a container action and runs on Linux only; the
      # binary is installed instead, so the same check runs on both OSes.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-deny@0.20.2
      # all-features is set in deny.toml ([graph] all-features = true).
      - run: cargo deny check

  bench:
    name: benchmark on main (ADR 0029, feature 5)
    # One job per merge on main, Linux only, never on a pull request
    # (docs/reference/bench-decision.md §4.2; the cost incident of
    # 2026-09-22). `--require-baseline`: a run that finds no baseline for
    # ci-linux fails and prints, on stderr, the entries to record, so the
    # job cannot be green by construction (§6.3 puts the CI baseline
    # first). Until the maintainer adds those entries to
    # crates/verso-bench/baselines.json the job is red on main, on purpose.
    # A pull request never runs it, and could not record a baseline if it did.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: the ladder against the ci-linux baseline
        run: cargo run --release -p verso-bench -- --machine ci-linux --json --require-baseline

  app:
    name: contract bindings up to date, UI checks (ADR 0026 rule 3, ADR 0038)
    # Phase 2 guardrail (ADR 0029): the TypeScript bindings committed in
    # app/ui/src/bindings.ts must be exactly what the Rust contract and
    # commands generate; otherwise rule 3 is a convention. Linux only:
    # the check is the same on every OS, and macOS runs cost more.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: WebKitGTK for the Tauri shell
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: the committed bindings are the generated ones
        run: |
          cargo run -q -p verso-app -- --export-bindings /tmp/bindings.ts
          diff -u app/ui/src/bindings.ts /tmp/bindings.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: UI type-checks and bundles
        working-directory: app/ui
        run: npm ci && npm run check && npm run build

