# CI: workspace guardrails on macOS and Linux (ADR 0029, roadmap item 0.11).
#
# Third-party actions are pinned by commit SHA, not by tag; the tag is in the
# comment for humans. Bumping one is a PR of its own.
#
# The toolchain comes from rust-toolchain.toml: `rustup show` installs the
# pinned version and its components (rustfmt, clippy) on the runner.
#
# `-D warnings` is passed on the clippy command line, not through RUSTFLAGS:
# RUSTFLAGS would apply to dependency crates too, and a dependency that merely
# warns would turn CI red with no fix in this repository.

# Cost (2026-09-22): Actions minutes in a private repository are a monthly
# budget and macOS is billed at 10x Linux. One day of pushing to five
# stacked branches, each push running the workflow twice (push and
# pull_request), with macOS on every job, spent the whole month's quota.
# Since then: a branch runs only as a pull request; a push runs only on
# main; macOS runs only on main (ADR 0029, revision of 2026-09-22).
#
# Layout (the maintainer's decision of 2026-09-23, ADR 0029): every job is a
# runner that starts, installs a toolchain and bills its minutes rounded up,
# so a pull request runs every guardrail but the fuzzing in ONE Linux job,
# cheapest first, over one cache. `main` runs that job again, plus clippy and
# the tests on macOS and on Windows, the fuzzing and the benchmark. No job here builds or
# packages the app: that happens only for a version tag, in a workflow of its
# own — branches test, they never package.
#
# Linux jobs run on ubuntu-24.04, not ubuntu-latest: the latest label moves to
# Ubuntu 26 from 2026-10-19, and a moved image would change the WebKitGTK
# packages the Tauri shell links against — and the machine the bench's
# ci-linux baseline is measured on — with no commit to blame.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# One run per PR head; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI's builds: it is most of target/, and with every
  # guardrail built in one job the runner's disk ran out on 2026-10-07
  # (#35, "No space left on device" building verso-app for the
  # bindings). A failure still names file and line; release builds are
  # their own profile and do not change.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  checks:
    name: guardrails (Linux)
    # A hung test holds a runner until GitHub's own 6 h: on 2026-10-31 and
    # 2026-11-02 one Windows test never ended. Each job stops at about
    # twice its usual length instead.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # --- No toolchain needed: seconds, so they run first and fail fast. ---
      - name: docs mirror (ADR 0008)
        run: bash scripts/check-docs-mirror.sh
      # The fixture lint compares each draft with main: an approval that
      # came undone fails. A shallow checkout has no main; fetch its tip.
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: fixtures structure and keys (ADR 0031)
        run: bash scripts/check-fixtures.sh
        env:
          FIXTURES_BASE: origin/main
          # No draft on main (roadmap, exit criterion 5); a branch may carry one.
          FIXTURES_STRICT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
      # Every package of the window's npm lockfile declares a license on the
      # allowlist, as cargo-deny holds the Rust tree to deny.toml. It reads
      # the lockfile only, with the runner's own Node.
      - name: npm licenses on the allowlist (ADR 0029)
        run: node scripts/check-npm-licenses.mjs
      # No advisory of severity high or critical in the same lockfile but by
      # a dated exception in app/ui/audit-exceptions.json, as cargo deny
      # holds the Rust tree (ADR 0083 item 13). It asks the registry.
      - name: npm advisories (ADR 0083 item 13)
        run: node scripts/check-npm-audit.mjs
      # No source file past 1500 lines, but by a recorded exception that
      # only shrinks. Node and git only.
      - name: source files under the size limit (ADR 0067)
        run: node scripts/check-sizes.mjs
      # The demo vault's boards are their modules' and the app's embedded
      # copy is the folder's: built, never edited by hand. Node and git only.
      - name: demo vault built from its sources (ADR 0058)
        run: node scripts/demo-vault.mjs check
      # The release page names every file the release workflow builds and
      # uploads, and nothing else (ADR 0051, revised 2026-10-14). Node only.
      - name: the release page names the release's files (ADR 0051)
        run: node --test scripts/release-page.test.mjs
      # verso-core's std::fs exception is the configuration directory alone,
      # written by src/sidecar.rs. Its clippy.toml has to allow the four
      # calls crate-wide (clippy cannot scope a list to one file), so this
      # grep holds the scope to that file. Comment lines are let through: the
      # crate's docs name the lint. `std::fs`, a bare `fs::` and `fs` imported
      # in braces (`use std::{fs, io}`) all count; `verso_fs::` does not.
      - name: std::fs in verso-core only in src/sidecar.rs (ADR 0029)
        run: |
          if grep -rnE --include='*.rs' '(std::fs|\bfs::|std::\{[^}]*\bfs\b)' crates/verso-core/src \
             | grep -v '^crates/verso-core/src/sidecar.rs:' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo 'std::fs outside crates/verso-core/src/sidecar.rs (ADR 0029)'
            exit 1
          fi
      # verso-app's exceptions are the OS edge — update downloads, the
      # application bundle, the Downloads folder — in src/update.rs, and the
      # app's diagnostic log in src/log.rs, confined the same way (its
      # clippy.toml carries an empty list, so this grep is the scope; ADR
      # 0029, revisions of 2026-09-29 and 2026-10-01). And src/resolv_conf.rs,
      # which reads the Linux resolver files (the system's DNS servers, for
      # dns.rs) and nothing else: an exception of ADR 0097, declared there,
      # that awaits the maintainer's ratification; scripts/check.sh holds the
      # same list. And src/tunnel/files.rs, the internet link's files in the
      # app's data directory — the pinned cloudflared downloaded, checked and
      # extracted, an own address's credentials (ADR 0117 D3 item 5, D10) —
      # never a folder's: declared with S5, awaiting the maintainer's
      # ratification.
      - name: std::fs in verso-app only in src/update.rs, src/log.rs, src/resolv_conf.rs and src/tunnel/files.rs (ADR 0029, ADR 0097, ADR 0117)
        run: |
          if grep -rnE --include='*.rs' '(std::fs|\bfs::|std::\{[^}]*\bfs\b)' app/src-tauri/src \
             | grep -vE '^app/src-tauri/src/(update|log|resolv_conf|tunnel/files)\.rs:' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo 'std::fs outside app/src-tauri/src/update.rs, src/log.rs, src/resolv_conf.rs and src/tunnel/files.rs (ADR 0029, ADR 0097, ADR 0117)'
            exit 1
          fi
      # `unsafe` in two files and nowhere else: the native clipping of an
      # embedded page (app/src-tauri/src/web_clip/macos.rs and windows.rs).
      # The workspace forbids it; verso-app's lint table says `deny` so that
      # those two files can allow it, and this holds the table to the
      # workspace's and the code to those files (ADR 0029, revision of
      # 2026-10-15). Node and git only.
      - name: unsafe only in web_clip's platform files (ADR 0029)
        run: |
          node --test scripts/check-unsafe.test.mjs
          node scripts/check-unsafe.mjs

      # --- The toolchain, the WASM target, one cache for everything below. ---
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      # all-features is set in deny.toml ([graph] all-features = true); with
      # no `targets` there, the graph covers every platform's dependencies, so
      # one run on Linux answers for macOS and Windows too. cargo-nextest
      # runs the tests below (fix release item C2, 2026-11-02): each test in
      # a process of its own, with the limit of .config/nextest.toml, so a
      # test that hangs fails the job in minutes. Apache-2.0 OR MIT; a
      # release binary checked against the action's manifest, the latest
      # version that manifest knows at the pinned commit.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.145
      - name: cargo deny (ADR 0029)
        run: cargo deny check

      # --- The window's UI: checked, and bundled into app/ui/dist, which the
      # Tauri shell embeds when it compiles (`generate_context!` refuses a
      # missing frontendDist), so it comes before any Rust build. ---
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The window's unit tests too (decided on 2026-10-01, review
      # `board.md` §6 item 12); its end-to-end tests stay local (ADR 0058).
      - name: UI type-checks, bundles and unit tests
        working-directory: app/ui
        run: npm ci && npm run check && npm run build && npm test

      # --- The workspace, the Tauri shell with it. ---
      # The workspace includes the Tauri shell (app/src-tauri, Phase 2), which
      # links against WebKitGTK on Linux; macOS has WebKit built in.
      - name: WebKitGTK for the Tauri shell
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # nextest does not run doctests; `cargo test --doc` does, after it.
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked
      - name: doctests
        run: cargo test --doc --workspace --all-features --locked
      # Phase 2 guardrail: the TypeScript bindings committed in
      # app/ui/src/bindings.ts must be exactly what the Rust contract and
      # commands generate; otherwise rule 3 (ADR 0026) is a convention. The
      # exporter reuses the dependencies the tests built (`tauri` itself is
      # built again, without its test feature).
      - name: the committed bindings are the generated ones (ADR 0026 rule 3, ADR 0038)
        run: |
          cargo run -q --locked -p verso-app -- --export-bindings /tmp/bindings.ts
          diff -u app/ui/src/bindings.ts /tmp/bindings.ts
      # The fuzz harnesses are packages outside the workspace, so clippy and
      # the tests never build them; checked here on every pull request (as
      # scripts/check.sh does), run on nightly only in the fuzz job.
      - name: the fuzz harnesses compile (ADR 0029, ADR 0083 item 14)
        run: |
          for fuzz in crates/verso-dialect/fuzz crates/verso-server/fuzz; do
            cargo check -q --locked --manifest-path "$fuzz/Cargo.toml" --target-dir target --all-targets
          done
      # Feature guardrail of Phase 1, feature 1: the parser keeps compiling to
      # WASM (ADR 0029). The target is the same from any host, so Linux alone.
      - name: verso-dialect compiles to wasm32 (ADR 0029)
        run: cargo check --target wasm32-unknown-unknown -p verso-dialect --locked

  macos:
    name: clippy and tests on macOS (main)
    # The checks whose answer can depend on the platform — the file system,
    # extended attributes, WebKit — on the platform Phase 2 ships on. Only
    # after a merge: a macOS minute bills as ten Linux ones.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The Tauri shell embeds app/ui/dist when it compiles, and the bundle is
      # not versioned. Clippy and the tests do not look at the UI, so an empty
      # page stands in for it here instead of installing Node on a runner
      # billed ten times over; the Linux job builds and checks the real one.
      # `dist-web` (the files served to a phone, `ui-web` in the app) is an
      # empty folder here for the same reason.
      - name: a stand-in for the UI bundle
        run: mkdir -p app/ui/dist app/ui/dist-web && printf '<!doctype html><title>Verso</title>\n' > app/ui/dist/index.html
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-nextest@0.9.145
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked
      - name: doctests
        run: cargo test --doc --workspace --all-features --locked

  windows:
    name: clippy and tests on Windows (main)
    # The Windows port (ADR 0069, item 6): the same platform checks as
    # macOS's, on Windows, after a merge only — a Windows minute bills as
    # about 1.7 Linux ones. The image is pinned, as the Linux ones are.
    # scripts/check-windows.sh runs clippy and the tests before a push
    # (with `cargo test`: the VM has no cargo-nextest yet).
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 100
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      # Before the checkout: the runner's Git converts line endings, and the
      # fixtures and the round-trip tests are about bytes (invariant 7).
      - name: no line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # As on macOS: an empty page stands in for the UI bundle.
      - name: a stand-in for the UI bundle
        run: mkdir -p app/ui/dist app/ui/dist-web && printf '<!doctype html><title>Verso</title>\n' > app/ui/dist/index.html
      # The server builds here too (ADR 0075 item 2, revised 2026-10-15):
      # webauthn-rs's OpenSSL is compiled from source (the `openssl` crate's
      # `vendored` feature, on every target), which runs Perl. The image
      # ships Strawberry Perl on the PATH (windows-2025 image list); the step
      # below fails the job early and plainly if that ever stops being true,
      # and makes the build use it rather than the Perl of Git for Windows,
      # whose paths openssl-src's Configure cannot use. No NASM: without it
      # openssl-src builds with `no-asm`. The first build of OpenSSL is a few
      # minutes of the job; rust-cache keeps its output afterwards.
      - name: Strawberry Perl for the vendored OpenSSL
        run: |
          perl_exe="$(cygpath -u 'C:\Strawberry\perl\bin\perl.exe')"
          test -x "$perl_exe" || { echo "::error::no Strawberry Perl on this image: install it (choco install strawberryperl)"; exit 1; }
          "$perl_exe" -v | sed -n 2p
          echo "OPENSSL_SRC_PERL=C:\\Strawberry\\perl\\bin\\perl.exe" >> "$GITHUB_ENV"
      # The hangs of 2026-10-31 and 2026-11-02 were here: with nextest a
      # test that never ends fails at the limit of .config/nextest.toml.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-nextest@0.9.145
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features --locked
      - name: doctests
        run: cargo test --doc --workspace --all-features --locked

  fuzz:
    # Feature guardrail of Phase 1, feature 1 (ADR 0029). After each merge,
    # Linux only: the parser rarely changes now, and a minute of fuzzing on
    # every pull request cost a runner of its own each time. cargo-fuzz needs
    # nightly for its sanitizer; the pinned toolchain in rust-toolchain.toml
    # is bypassed with `+nightly` for this job only. It runs from the
    # versioned seeds in `fuzz/seeds` (one file per input that once broke
    # something; see the fuzz target's doc); the corpus grows in
    # `fuzz/corpus` locally and is not versioned, so the directory is created
    # here — cargo-fuzz does not create a corpus directory it was given by
    # name. Inputs up to 64 KiB: the 8 KB frontmatter that overflowed the
    # stack was out of reach of the 4 KiB default (review of PR #7,
    # finding 2). The server's inputs have a harness of their own
    # (crates/verso-server/fuzz, ADR 0083 item 14): the WebSocket's request,
    # a binary frame, a Yjs update into a note's room and into a board's,
    # a presence, the Host and Origin checks and a size, each 60 s from its
    # versioned seeds in `fuzz/seeds-<target>`, the same way, built as the
    # server ships (`-O`, see the step).
    name: verso-dialect, canvas, pattern and server fuzz, 60s each (main, ADR 0029, ADR 0083, ADR 0094)
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2, resolved 2026-09-21
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates/verso-dialect/fuzz
            crates/verso-server/fuzz
      # install-action ships a static (musl) cargo-fuzz on Linux, and
      # cargo-fuzz defaults --target to the platform it was built for; the
      # sanitizer does not link against static musl, so the target is explicit.
      - name: fuzz parse for 60 seconds
        working-directory: crates/verso-dialect
        run: |
          mkdir -p fuzz/corpus/parse
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse fuzz/corpus/parse fuzz/seeds -- -max_total_time=60 -max_len=65536 -timeout=20
      # The canvas reader of verso-core, compiled from its own source in the
      # same harness (decided on 2026-10-01, review `board.md` §6 item 9).
      - name: fuzz canvas for 60 seconds
        working-directory: crates/verso-dialect
        run: |
          mkdir -p fuzz/corpus/canvas
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu canvas fuzz/corpus/canvas fuzz/seeds-canvas -- -max_total_time=60 -max_len=65536 -timeout=20
      # A base's regular expressions (ADR 0094, Consequences): verso-core's
      # pattern translation and its searches, compiled from their own source
      # in the same harness, as the canvas is.
      - name: fuzz pattern for 60 seconds
        working-directory: crates/verso-dialect
        run: |
          mkdir -p fuzz/corpus/pattern
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu pattern fuzz/corpus/pattern fuzz/seeds-pattern -- -max_total_time=60 -max_len=4096 -timeout=20
      # The server's inputs (ADR 0083 item 14, F6), one target after the
      # other in one step: a crash ends it, and its input is kept below.
      # What each target feeds and what a crash means is in its doc comment.
      # Built with `-O`, the release profile without debug assertions or
      # overflow checks, as the server ships: yrs asserts and overflows in a
      # debug build on what a release build takes (the first runs of
      # 2026-10-13), and those are not what a member can do to a server.
      # The dialect's and the canvas's keep cargo-fuzz's default flags.
      - name: fuzz the server's inputs for 60 seconds each
        working-directory: crates/verso-server
        run: |
          for target in request unframe note board presence host size link; do
            mkdir -p fuzz/corpus/$target
            cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu $target fuzz/corpus/$target fuzz/seeds-$target -- -max_total_time=60 -max_len=65536 -timeout=20
          done
      - name: keep a crash, if any, as an artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: |
            crates/verso-dialect/fuzz/artifacts
            crates/verso-server/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  bench:
    name: benchmark on main (ADR 0029, feature 5)
    # One job per merge on main, Linux only, never on a pull request
    # (docs/reference/bench-decision.md §4.2; the cost incident of
    # 2026-09-22). `--require-baseline`: a run that finds no baseline for
    # ci-linux fails and prints, on stderr, the entries to record, so the
    # job cannot be green by construction (§6.3 puts the CI baseline
    # first). The ci-linux entries were recorded from the first run on main,
    # at 05b9604, with the maintainer's approval (2026-09-24); from then on
    # the job is red only for a regression past the tolerances. A pull
    # request never runs it, and could not record a baseline if it did.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: the ladder against the ci-linux baseline
        run: cargo run --release -p verso-bench -- --machine ci-linux --json --require-baseline
