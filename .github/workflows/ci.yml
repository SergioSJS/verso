# CI: workspace guardrails on macOS and Linux (ADR 0029, roadmap item 0.11).
#
# Third-party actions are pinned by commit SHA, not by tag; the tag is in the
# comment for humans. Bumping one is a PR of its own.
#
# The toolchain comes from rust-toolchain.toml: `rustup show` installs the
# pinned version and its components (rustfmt, clippy) on the runner.
#
# `-D warnings` is passed on the clippy command line, not through RUSTFLAGS:
# RUSTFLAGS would apply to dependency crates too, and a dependency that merely
# warns would turn CI red with no fix in this repository.

name: ci

on:
  push:
    branches: ["main", "fase0/**", "phase*", "phase*/**", "test/**"]
  pull_request:

# A PR from a fase0/** branch triggers both events; keep only the latest run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-mirror:
    name: docs mirror (ADR 0008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: bash scripts/check-docs-mirror.sh
      - name: fixtures structure and keys (ADR 0031)
        run: bash scripts/check-fixtures.sh

  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  deny:
    # On both operating systems: ADR 0029 and roadmap exit criterion 3 list
    # `cargo deny check` with the other three, on macOS and Linux.
    name: cargo deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
